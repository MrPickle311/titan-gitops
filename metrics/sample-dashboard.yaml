apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-dashboard
  namespace: monitoring
  labels:
    # This label is critical: it tells the Grafana sidecar to load this ConfigMap as a dashboard
    grafana_dashboard: "1"
data:
  sample-dashboard.json: |-
    {
      "title": "Sample Cluster CPU Dashboard",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Node CPU Usage (%)",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "percent"
            },
            "overrides": []
          }
        }
      ]
    }
