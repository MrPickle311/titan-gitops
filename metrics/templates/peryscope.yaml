apiVersion: argoproj.io/v2alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 1.20.3
    chart: pyroscope
    helm:
      values: |
        pyroscope:
          extraArgs:
            # blocks are kept 6 months (default: forever)
            compactor.blocks-retention-period: 4380h
          persistence:
            enabled: true
            storageClassName: longhorn-sas-hdd
            size: 50Gi
          storage:
            backend: filesystem
            filesystem:
              directory: /var/lib/pyroscope
          limits:
            ingest_max_jfr_decompressed_size: 33554432
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true