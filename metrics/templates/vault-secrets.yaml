apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: titan-auth
  namespace: monitoring
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: titan-app-role
    serviceAccount: default
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-credentials
  namespace: monitoring
spec:
  vaultAuthRef: titan-auth
  mount: secret
  type: kv-v2
  path: titan/grafana-credentials
  destination:
    name: grafana-credentials
    create: true
    overwrite: true
