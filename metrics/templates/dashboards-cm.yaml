{{- range $path, $bytes := .Files.Glob "dashboards/**.json" }}
{{- $folderName := base (dir $path) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | replace ".json" "" | replace "_" "-" | lower }}
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    {{- if ne $folderName "dashboards" }}
    k8s-sidecar-target-directory: {{ $folderName | quote }}
    {{- else }}
    k8s-sidecar-target-directory: "General"
    {{- end }}
data:
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
---
{{- end }}
