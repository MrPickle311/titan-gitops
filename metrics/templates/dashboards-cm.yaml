{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | replace ".json" "" | replace "_" "-" | lower }}
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "databases"
data:
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
---
{{- end }}
