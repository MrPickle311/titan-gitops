apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 62.7.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          revisionHistoryLimit: 0
          image:
            tag: 11.6.15
          plugins:
            - yesoreyeram-infinity-datasource
            - hamedkarbasi93-kafka-datasource
          admin:
            existingSecret: "grafana-credentials"
            userKey: admin-user
            passwordKey: admin-password
          
          ingress:
            enabled: false
          
          persistence:
            enabled: true
            storageClassName: "openebs-hostpath"
            size: 5Gi

          sidecar:
            dashboards:
              provider:
                foldersFromFilesStructure: true

          deleteDatasources:
            - name: JSON API - Export Batch
              orgId: 1
            - name: JSON API - Ledger
              orgId: 1
            - name: JSON API - Payment
              orgId: 1
            - name: JSON API - Wallet
              orgId: 1

          additionalDataSources:
            - name: kafka-datasource
              type: hamedkarbasi93-kafka-datasource
              uid: kafka-datasource
              access: proxy
              jsonData:
                bootstrapServers: "kafka.messaging.svc.cluster.local:9092"
                clientId: "grafana-kafka-client"
                schemaRegistryUrl: "http://schema-registry.messaging.svc.cluster.local:8081"
                securityProtocol: "PLAINTEXT"
            - name: Infinity
              type: yesoreyeram-infinity-datasource
              uid: infinity
              access: proxy
            - name: Pyroscope
              type: pyroscope
              uid: pyroscope
              url: http://pyroscope.monitoring.svc.cluster.local:4040
              access: proxy
          
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "trace_id=([0-9a-fA-F]+)"
                    name: TraceID
                    url: "$${__value.raw}"

            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                serviceMap:
                  datasourceUid: prometheus
                tracesToProfiles:
                  datasourceUid: pyroscope
                  tags:
                    - key: 'service.name'
                      value: 'service_name'
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceId: false
                  filterBySpanId: false
                  customQuery: true
                  query: '{app="$${__span.tags["service.name"]}"} |= "$${__span.traceId}"'

        prometheus:
          prometheusSpec:
            podMetadata:
              labels:
                sidecar.istio.io/inject: "true"
            enableRemoteWriteReceiver: true
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            # ServiceMonitor scrapes pod IPs directly (via Endpoints) - Istio's
            # outbound mTLS auto-origination doesn't reliably apply to that
            # passthrough traffic under STRICT mTLS (confirmed: same request
            # works fine via the Service DNS name, fails via raw pod IP with a
            # 503 and zero RBAC evaluations on the destination side). Static
            # config targeting the Service name instead, proven to work.
            # Covers every service in applications - the six grpc-only ones
            # (sanctions/fx/fee/authorization/fraud/limits) also run a Spring
            # Boot actuator on 8080 despite the Service only ever exposing
            # their grpc port; confirmed by probing pod IPs directly and
            # added an "http" port to each Service so the DNS name resolves.
            additionalScrapeConfigs:
              - job_name: app-actuator-metrics
                metrics_path: /actuator/prometheus
                scrape_interval: 15s
                static_configs:
                  - targets:
                      - payment-service.applications.svc.cluster.local:8080
                      - wallet-service.applications.svc.cluster.local:8081
                      - ledger-service.applications.svc.cluster.local:8082
                      - export-batch-service.applications.svc.cluster.local:8083
                      - outbox-relay-service.applications.svc.cluster.local:8089
                      - mock-regulatory-service.applications.svc.cluster.local:8084
                      - webhooks-service.applications.svc.cluster.local:8085
                      - sanctions-service.applications.svc.cluster.local:8080
                      - fx-service.applications.svc.cluster.local:8080
                      - fee-service.applications.svc.cluster.local:8080
                      - authorization-service.applications.svc.cluster.local:8080
                      - fraud-service.applications.svc.cluster.local:8080
                      - limits-service.applications.svc.cluster.local:8080
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: "openebs-hostpath"
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            
            retention: 24h
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2048Mi

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true