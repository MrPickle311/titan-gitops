apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 62.7.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          image:
            tag: 10.4.5
          plugins:
            - yesoreyeram-infinity-datasource
          admin:
            existingSecret: "grafana-credentials"
            userKey: admin-user
            passwordKey: admin-password
          
          ingress:
            enabled: true
            ingressClassName: "nginx"
            annotations:
              cert-manager.io/cluster-issuer: "homelab-ca-issuer"
            hosts:
              - grafana.homelab
            tls:
              - secretName: grafana-tls-secret
                hosts:
                  - grafana.homelab
          
          persistence:
            enabled: true
            storageClassName: "openebs-hostpath"
            size: 5Gi

          sidecar:
            dashboards:
              provider:
                foldersFromFilesStructure: true

          additionalDataSources:
            - name: Infinity
              type: yesoreyeram-infinity-datasource
              uid: infinity
              access: proxy
            - name: Pyroscope
              type: pyroscope
              uid: pyroscope
              url: http://pyroscope.monitoring.svc.cluster.local:4040
              access: proxy
          
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "trace_id=([0-9a-fA-F]+)"
                    name: TraceID
                    url: "$${__value.raw}"

            # 2. Deklarujemy Tempo i podpinamy do niego Service Graph oraz Span Profiles
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                serviceMap:
                  datasourceUid: prometheus
                tracesToProfiles:
                  datasourceUid: pyroscope
                  tags:
                    - key: 'service.name'
                      value: 'service_name'
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceId: false
                  filterBySpanId: false
                  customQuery: true
                  query: '{app="$${__span.tags["service.name"]}"} |= "$${__span.traceId}"'

        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: "openebs-hostpath"
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            
            retention: 24h
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2048Mi

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true