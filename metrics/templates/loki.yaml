apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 2.10.3
    chart: loki-stack
    helm:
      values: |
        loki:
          isDefault: false
          image:
            tag: 2.9.3
          persistence:
            enabled: true
            storageClassName: "longhorn"
            # Bumped from 10Gi: openebs-hostpath never actually enforced
            # the PVC size quota - real usage had crept to 12.2G before
            # this migration (PMT-048), which Longhorn's real block-device
            # sizing does enforce. Sized with headroom above that.
            size: 20Gi
          config:
            limits_config:
              reject_old_samples: true
              reject_old_samples_max_age: 720h
              ingestion_rate_mb: 32
              ingestion_burst_size_mb: 64
              retention_period: 24h
            table_manager:
              retention_deletes_enabled: true
              retention_period: 24h

        promtail:
          enabled: true
          containerSecurityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
          extraVolumes:
            - name: kube-audit-log
              hostPath:
                path: /var/log/audit/kube
                type: DirectoryOrCreate
          extraVolumeMounts:
            - name: kube-audit-log
              mountPath: /var/log/audit/kube
              readOnly: true
          config:
            snippets:
              pipelineStages:
                - cri: {}
                - regex:
                    expression: "(?i)(?P<level>INFO|WARN|ERROR|DEBUG|TRACE)"
                - labels:
                    level:
              extraScrapeConfigs: |
                - job_name: kube-audit
                  static_configs:
                    - targets:
                        - localhost
                      labels:
                        job: kube-audit
                        __path__: /var/log/audit/kube/*.log

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true