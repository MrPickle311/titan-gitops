apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikijs
  namespace: collaboration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikijs
  template:
    metadata:
      labels:
        app: wikijs
    spec:
      containers:
      - name: wikijs
        image: ghcr.io/requarks/wiki:2
        ports:
        - containerPort: 3000
        env:
        - name: DB_TYPE
          value: "postgres"
        - name: DB_HOST
          value: "wikijs-db-postgresql.databases.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "wikijs"
        - name: DB_PASS
          value: "wikijs123"
        - name: DB_NAME
          value: "wikijs"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wikijs
  namespace: collaboration
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: wikijs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wikijs
  namespace: collaboration
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: wikijs.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wikijs
            port:
              number: 80
