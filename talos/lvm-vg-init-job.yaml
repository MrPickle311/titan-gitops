# One-shot bootstrap Job: pvcreate + vgcreate on a node's extra disk.
# NOT GitOps-managed, NOT idempotent against an already-initialized disk.
# Fill in <NODE_HOSTNAME> and <DEVICE_PATH> (from `talosctl get disks`),
# `kubectl apply -f`, check the logs, then `kubectl delete -f` it.
apiVersion: batch/v1
kind: Job
metadata:
  name: lvm-vg-init-<NODE_HOSTNAME>
  namespace: openebs
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: <NODE_HOSTNAME>
      hostPID: true
      containers:
        - name: vgcreate
          image: openebs/lvm-driver:1.9.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              pvcreate <DEVICE_PATH>
              vgcreate data-vg <DEVICE_PATH>
              vgs
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: lvm-run
              mountPath: /run/lvm
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: lvm-run
          hostPath:
            path: /run/lvm
