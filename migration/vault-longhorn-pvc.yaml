# One-shot: new Longhorn PVC to receive vault-0's data during the
# openebs-hostpath -> longhorn migration (PMT-048). Not GitOps-managed -
# apply manually, delete once the migration's done (see migration/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-vault-longhorn-temp
  namespace: security
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
