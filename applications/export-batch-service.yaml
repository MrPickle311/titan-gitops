---
apiVersion: v1
kind: Service
metadata:
  name: export-batch-service
  namespace: applications
  labels:
    app: export-batch-service
spec:
  selector:
    app: export-batch-service
  ports:
  - name: http
    port: 8083
    targetPort: 8083
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: export-batch-monitor
  namespace: applications
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: export-batch-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
