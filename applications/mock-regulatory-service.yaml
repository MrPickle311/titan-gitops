apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-regulatory-service
  namespace: applications
  labels:
    app: mock-regulatory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-regulatory-service
  template:
    metadata:
      labels:
        app: mock-regulatory-service
    spec:
      containers:
      - name: mock-api
        image: registry.homelab/mock-regulatory-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
        env:
        - name: MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES
          value: "ALWAYS"
        - name: SERVER_PORT
          value: "8084"
        - name: REGULATORY_FAILURE_RATE
          value: "0.1"
---
apiVersion: v1
kind: Service
metadata:
  name: mock-regulatory-service
  namespace: applications
  labels:
    app: mock-regulatory-service
spec:
  selector:
    app: mock-regulatory-service
  ports:
  - name: http
    port: 8084
    targetPort: 8084
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mock-regulatory-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
spec:
  tls:
    - hosts:
        - regulatory.homelab
      secretName: regulatory-tls-secret
  rules:
  - host: regulatory.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mock-regulatory-service
            port:
              number: 8084
