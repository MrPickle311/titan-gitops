apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: applications
  labels:
    app: wallet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      # WSPÓŁDZIELONY WOLUMEN W PAMIĘCI
      volumes:
        - name: pyroscope-agent
          emptyDir: {}
          
      # INIT CONTAINER: Pobiera agenta OTel i rozszerzenie Pyroscope
      initContainers:
        - name: fetch-otel-pyroscope
          image: busybox:latest
          command:
            - sh
            - -c
            - "wget -O /agent/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar && wget -O /agent/pyroscope-otel.jar https://github.com/grafana/otel-profiling-java/releases/latest/download/pyroscope-otel.jar && wget -O /agent/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/latest/download/pyroscope.jar"
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /agent

      containers:
      - name: wallet-service
        image: registry.homelab/wallet-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        
        # PODPIĘCIE AGENTA DO GŁÓWNEGO KONTENERA
        volumeMounts:
          - name: pyroscope-agent
            mountPath: /agent
            
        env:
        # MAGICZNA FLAGA JAVY: Automatycznie podpina agenta OpenTelemetry przy starcie
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/agent/pyroscope.jar -javaagent:/agent/opentelemetry-javaagent.jar"
          
        # ROZSZERZENIE PYROSCOPE DLA OPENTELEMETRY I KONFIGURACJA
        - name: OTEL_JAVAAGENT_EXTENSIONS
          value: "/agent/pyroscope-otel.jar"
        - name: OTEL_PYROSCOPE_START_PROFILING
          value: "true"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_URL
          value: "false"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_BASELINE_URL
          value: "false"
        - name: OTEL_SERVICE_NAME
          value: "wallet-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo.monitoring.svc.cluster.local:4318"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
          
        # KONFIGURACJA PROFILERA PYROSCOPE
        - name: PYROSCOPE_APPLICATION_NAME
          value: "wallet-service"
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://pyroscope.monitoring.svc.cluster.local:4040"
        - name: PYROSCOPE_FORMAT
          value: "jfr"
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: "10ms"
        - name: PYROSCOPE_PROFILER_EVENT
          value: "itimer"
        - name: PYROSCOPE_PROFILER_LOCK
          value: "10ms"
        - name: PYROSCOPE_PROFILER_ALLOC
          value: "512k"
        - name: PYROSCOPE_LOG_LEVEL
          value: "info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PYROSCOPE_LABELS
          value: "pod=$(POD_NAME),service_name=wallet-service"
          
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-postgresql.databases.svc.cluster.local:5432/titan_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: applications
  labels:
    app: wallet-service
spec:
  selector:
    app: wallet-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wallet-service-monitor
  namespace: applications
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: wallet-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet-service-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  tls:
    - hosts:
        - wallet.homelab
      secretName: wallet-tls-secret
  rules:
  - host: wallet.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8081
