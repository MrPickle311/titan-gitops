apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: applications
  labels:
    app: wallet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
      - name: wallet-service
        image: registry.homelab/wallet-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-postgresql.databases.svc.cluster.local:5432/titan_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: applications
  labels:
    app: wallet-service
spec:
  selector:
    app: wallet-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wallet-service-monitor
  namespace: applications
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: wallet-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet-service-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  tls:
    - hosts:
        - wallet.homelab
      secretName: wallet-tls-secret
  rules:
  - host: wallet.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wallet-service
            port:
              number: 8081
