# PMT-007. Only the ingress gateway has any legitimate reason to reach
# docker-registry-ui - external access already goes through it, and
# nothing else in-cluster calls this UI directly. Ingress-only: doesn't
# touch what docker-registry-ui itself can reach outward. Deliberately
# NOT the docker-registry deployment (the actual push/pull API) - that
# one needs to stay reachable from every node's containerd, not just
# from pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-registry-ui-ingress
  namespace: container-registry
spec:
  podSelector:
    matchLabels:
      app: docker-registry-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 80
