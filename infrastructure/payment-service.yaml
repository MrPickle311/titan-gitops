apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      # WSPÓŁDZIELONY WOLUMEN W PAMIĘCI
      volumes:
        - name: pyroscope-agent
          emptyDir: {}
          
      # INIT CONTAINER: Pobiera agenta zanim wystartuje Spring
      initContainers:
        - name: fetch-pyroscope-agent
          image: busybox:latest
          command:
            - sh
            - -c
            - "wget -O /agent/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/latest/download/pyroscope.jar"
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /agent

      containers:
      - name: payment-service
        image: registry.homelab/payment-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        
        # PODPIĘCIE AGENTA DO GŁÓWNEGO KONTENERA
        volumeMounts:
          - name: pyroscope-agent
            mountPath: /agent
            
        env:
        # MAGICZNA FLAGA JAVY: Automatycznie podpina agenta przy starcie (bez zmiany Dockerfile!)
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/agent/pyroscope.jar"
          
        # KONFIGURACJA PROFILERA PYROSCOPE
        - name: PYROSCOPE_APPLICATION_NAME
          value: "payment-service"
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://pyroscope.monitoring.svc.cluster.local:4040"
        - name: PYROSCOPE_FORMAT
          value: "jfr" # Java Flight Recorder - najwydajniejszy format
        - name: PYROSCOPE_PROFILING_LOCK
          value: "10ms" # Wykrywa blokady wątków (Thread locking)
          
        # Zależności bazy i Kafki
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-postgresql.databases.svc.cluster.local:5432/titan_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: WALLET_SERVICE_URL
          value: http://wallet-service:8081
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.messaging.svc.cluster.local:9092
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-service-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: payment-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  tls:
    - hosts:
        - payment.homelab
      secretName: payment-tls-secret
  rules:
  - host: payment.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8080