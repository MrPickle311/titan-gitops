apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: security

resources:
  - github.com/keycloak/keycloak-k8s-resources/kubernetes?ref=26.7.1

patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
