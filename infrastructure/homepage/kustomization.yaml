apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests.yaml

configMapGenerator:
  - name: homepage-config
    namespace: infrastructure
    files:
      - config/kubernetes.yaml
      - config/services.yaml
      - config/settings.yaml
      - config/widgets.yaml

generatorOptions:
  disableNameSuffixHash: true
