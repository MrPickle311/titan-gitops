apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-sa
  namespace: applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-k8s-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-k8s-viewer-binding
subjects:
  - kind: ServiceAccount
    name: homepage-sa
    namespace: applications
roleRef:
  kind: ClusterRole
  name: homepage-k8s-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: applications
data:
  settings.yaml: |
    title: Titan Homelab
    background: https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070&auto=format&fit=crop
    cardBlur: sm
    theme: dark
  kubernetes.yaml: |
    mode: cluster
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
          cpu: true
          memory: true
    - resources:
        cpu: true
        memory: true
  services.yaml: |
    - Titan Services:
        - Payment Service:
            icon: si-googlepay
            href: https://payment.homelab
            description: Core payment processing service
            widget:
              type: iframe
              url: https://payment.homelab
              height: 400
            podSelector: app=payment-service
            namespace: applications
        - Wallet Service:
            icon: si-googlewallet
            href: https://wallet.homelab
            description: User wallet and balance management
            widget:
              type: iframe
              url: https://wallet.homelab
              height: 400
            podSelector: app=wallet-service
            namespace: applications
        - Ledger Service:
            icon: si-bookstack
            href: https://ledger.homelab
            description: Double-entry accounting ledger
            widget:
              type: iframe
              url: https://ledger.homelab
              height: 400
            podSelector: app=ledger-service
            namespace: applications
        - Export Batch:
            icon: si-export
            href: https://export-batch.homelab/batch
            description: Batch processing and export jobs
            widget:
              type: iframe
              url: https://export-batch.homelab/batch
              height: 400
            podSelector: app=export-batch-service
            namespace: applications
        - Regulatory Service:
            icon: si-checkmarx
            href: https://regulatory.homelab
            description: Mock regulatory compliance service
            widget:
              type: iframe
              url: https://regulatory.homelab
              height: 400
            podSelector: app=mock-regulatory-service
            namespace: applications
    - Infrastructure:
        - ArgoCD:
            icon: argo
            href: https://argocd.homelab/
        - Grafana:
            icon: grafana
            href: https://grafana.homelab
        - Prometheus:
            icon: prometheus
            href: https://prometheus.homelab
        - Docker Registry:
            icon: docker
            href: https://registry.homelab
            podSelector: app=docker-registry
            namespace: container-registry
        - Kafka Control Center:
            icon: apachekafka
            href: https://kafka.homelab
            podSelector: app=control-center
            namespace: messaging
        - Schema Registry:
            icon: confluent
            href: https://schema.homelab
            podSelector: app=schema-registry
            namespace: messaging
        - Chaos Mesh:
            icon: chaosmesh
            href: https://chaos.homelab
            podSelector: app.kubernetes.io/component=chaos-dashboard
            namespace: chaos-mesh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: homepage-sa
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.homelab"
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
      volumes:
        - name: config
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: applications
spec:
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: homepage
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: homepage-ingress
  namespace: applications
spec:
  hosts:
    - homepage.homelab
  gateways:
    - istio-system/main-gateway
  http:
    - route:
        - destination:
            host: homepage
            port:
              number: 80
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: homepage
  namespace: applications
  annotations:
    istio.io/dry-run: "true"
spec:
  selector:
    matchLabels:
      app: homepage
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
