apiVersion: v1
kind: ServiceAccount
metadata:
  name: rancher-sa
  namespace: applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rancher-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: rancher-sa
    namespace: applications
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rancher-data
  namespace: applications
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher
  template:
    metadata:
      labels:
        app: rancher
    spec:
      serviceAccountName: rancher-sa
      containers:
        - name: rancher
          image: rancher/rancher:latest
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: data
              mountPath: /var/lib/rancher
          securityContext:
            privileged: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rancher-data
---
apiVersion: v1
kind: Service
metadata:
  name: rancher
  namespace: applications
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  selector:
    app: rancher
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rancher-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  tls:
    - hosts:
        - rancher.homelab
      secretName: rancher-tls
  rules:
    - host: rancher.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rancher
                port:
                  number: 443
