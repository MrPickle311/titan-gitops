apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: titan-keycloak
  namespace: security
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-cluster-rw.databases
    database: keycloak
    usernameSecret:
      name: keycloak-db-cluster-app
      key: username
    passwordSecret:
      name: keycloak-db-cluster-app
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: keycloak.homelab
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  # Temporary - diagnosing the admin console "Unable to determine error
  # message" / cookie_not_found issue. Revert once resolved.
  additionalOptions:
    - name: log-level
      value: "INFO,org.keycloak.events:debug,org.keycloak.services:debug,org.keycloak.authentication:debug,org.keycloak.protocol.oidc:debug,org.keycloak.sessions:debug,org.keycloak.cookie:debug"
