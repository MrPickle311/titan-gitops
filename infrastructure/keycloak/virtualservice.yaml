apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: keycloak
  namespace: security
spec:
  hosts:
  - keycloak.homelab
  gateways:
  - istio-system/main-gateway
  http:
  - route:
    - destination:
        host: titan-keycloak-service
        port:
          number: 8080
