apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-patcher
  namespace: applications
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-patcher-binding
  namespace: applications
subjects:
- kind: ServiceAccount
  name: default
  namespace: applications
roleRef:
  kind: Role
  name: workflow-patcher
  apiGroup: rbac.authorization.k8s.io
