apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-client-setup
  namespace: security
data:
  setup-client.sh: |
    #!/bin/bash
    set -euo pipefail

    KCADM=/opt/keycloak/bin/kcadm.sh
    SERVER=http://titan-keycloak-service.security.svc.cluster.local:8080

    for i in $(seq 1 30); do
      if $KCADM config credentials --server "$SERVER" --realm master --user "$ADMIN_USER" --password "$ADMIN_PASSWORD" 2>/tmp/login.err; then
        break
      fi
      echo "Waiting for Keycloak admin API... ($i/30)"
      cat /tmp/login.err
      sleep 5
    done

    # Keycloak has no built-in scope named "groups", but oauth2-proxy auto-requests
    # it whenever --oidc-groups-claim is set. Without this scope existing and being
    # attached to the client, the whole auth request is rejected with invalid_scope.
    SCOPE_JSON=$(cat <<'EOF'
    {
      "name": "groups",
      "protocol": "openid-connect",
      "protocolMappers": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-realm-role-mapper",
          "consentRequired": false,
          "config": {
            "claim.name": "groups",
            "jsonType.label": "String",
            "multivalued": "true",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
      ]
    }
    EOF
    )

    SCOPE_UUID=$($KCADM get client-scopes -r master --fields id,name --format csv --noquotes | grep ',groups$' | cut -d, -f1)

    if [ -z "$SCOPE_UUID" ]; then
      echo "Creating client scope 'groups'"
      echo "$SCOPE_JSON" | $KCADM create client-scopes -r master -f -
      SCOPE_UUID=$($KCADM get client-scopes -r master --fields id,name --format csv --noquotes | grep ',groups$' | cut -d, -f1)
    else
      echo "Client scope 'groups' already exists ($SCOPE_UUID)"
    fi

    CLIENT_JSON=$(cat <<EOF
    {
      "clientId": "oauth2-proxy",
      "enabled": true,
      "publicClient": false,
      "secret": "${CLIENT_SECRET}",
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "redirectUris": [
        "https://grafana.homelab/oauth2/callback",
        "https://kiali.homelab/oauth2/callback",
        "https://workflows.homelab/oauth2/callback",
        "https://chaos.homelab/oauth2/callback",
        "https://registry-ui.homelab/oauth2/callback",
        "https://homepage.homelab/oauth2/callback"
      ],
      "webOrigins": [
        "https://grafana.homelab",
        "https://kiali.homelab",
        "https://workflows.homelab",
        "https://chaos.homelab",
        "https://registry-ui.homelab",
        "https://homepage.homelab"
      ]
    }
    EOF
    )

    CLIENT_UUID=$($KCADM get clients -r master -q clientId=oauth2-proxy --fields id --format csv --noquotes | tail -n1)

    if [ -z "$CLIENT_UUID" ]; then
      echo "Creating client oauth2-proxy"
      echo "$CLIENT_JSON" | $KCADM create clients -r master -f -
      CLIENT_UUID=$($KCADM get clients -r master -q clientId=oauth2-proxy --fields id --format csv --noquotes | tail -n1)
    else
      echo "Updating client oauth2-proxy ($CLIENT_UUID)"
      echo "$CLIENT_JSON" | $KCADM update "clients/$CLIENT_UUID" -r master -f -
    fi

    echo "Attaching 'groups' scope to client as optional"
    $KCADM update "clients/$CLIENT_UUID/optional-client-scopes/$SCOPE_UUID" -r master

    echo "Done"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth2-proxy-client-setup
  namespace: security
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: quay.io/keycloak/keycloak:26.7.1
          command: ["/bin/bash", "/scripts/setup-client.sh"]
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: password
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-client
                  key: client-secret
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: oauth2-proxy-client-setup
            defaultMode: 0755
