apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: security
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.homelab/realms/master
            - --skip-oidc-discovery=true
            - --login-url=https://keycloak.homelab/realms/master/protocol/openid-connect/auth
            - --redeem-url=http://titan-keycloak-service.security.svc.cluster.local:8080/realms/master/protocol/openid-connect/token
            - --oidc-jwks-url=http://titan-keycloak-service.security.svc.cluster.local:8080/realms/master/protocol/openid-connect/certs
            - --profile-url=http://titan-keycloak-service.security.svc.cluster.local:8080/realms/master/protocol/openid-connect/userinfo
            - --client-id=oauth2-proxy
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --email-domain=*
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --cookie-secure=true
            - --oidc-groups-claim=groups
            - --allowed-group=admin
            - --skip-provider-button=true
            - --silence-ping-logging=true
            - --cookie-expire=24h
          ports:
            - containerPort: 4180
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-client
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-cookie
                  key: cookie-secret
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/homelab-ca.crt
          volumeMounts:
            - name: homelab-ca
              mountPath: /etc/ssl/certs/homelab-ca.crt
              subPath: ca.crt
      volumes:
        - name: homelab-ca
          configMap:
            name: homelab-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: security
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
