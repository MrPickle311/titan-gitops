apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: kafka-internal-clients
  namespace: security
spec:
  realmRef:
    name: titan
    kind: KeycloakRealm
  clientId: kafka-internal-clients
  public: false
  secret: $keycloak-kafka-internal-clients:client-secret
  directAccess: false
  standardFlowEnabled: false
  serviceAccount:
    enabled: true
