apiVersion: v1.edp.epam.com/v1
kind: KeycloakClientScope
metadata:
  name: groups
  namespace: security
spec:
  name: groups
  realmRef:
    name: master
    kind: KeycloakRealm
  description: "Realm roles exposed as the groups claim"
  type: optional
  protocol: openid-connect
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: "oidc-usermodel-realm-role-mapper"
      config:
        "claim.name": "groups"
        "jsonType.label": "String"
        "multivalued": "true"
        "id.token.claim": "true"
        "access.token.claim": "true"
        "userinfo.token.claim": "true"
