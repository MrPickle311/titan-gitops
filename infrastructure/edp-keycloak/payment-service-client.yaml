apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: payment-service-client
  namespace: security
spec:
  realmRef:
    name: titan
    kind: KeycloakRealm
  clientId: payment-service-client
  public: false
  secret: $keycloak-payment-service-client:client-secret
  directAccess: true
  standardFlowEnabled: true
  webUrl: https://payment.homelab
  redirectUris:
    - "https://payment.homelab/*"
  webOrigins:
    - "https://payment.homelab"
