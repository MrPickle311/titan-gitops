# ─────────────────────────────────────────────────────────────────────────────
# Helm values for Bitnami Spring Cloud Data Flow chart
# Chart: spring-cloud-dataflow  (bitnami)
# Target namespace: scdf
# ─────────────────────────────────────────────────────────────────────────────

# ── Messaging Backend ────────────────────────────────────────────────────────
kafka:
  enabled: false
  replicaCount: 1
  persistence:
    enabled: true
    size: 8Gi

rabbitmq:
  enabled: false

# ── Metadata Store ───────────────────────────────────────────────────────────
mariadb:
  enabled: true
  auth:
    rootPassword: "scdf-root-secret"   # change via sealed-secret/external-secrets in prod
    database: dataflow
  primary:
    persistence:
      enabled: true
      size: 4Gi

# ── SCDF Server ──────────────────────────────────────────────────────────────
server:
  image:
    registry: docker.io
    repository: bitnami/spring-cloud-dataflow
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  configuration:
    # Batch job metrics forwarded to Prometheus
    batchMetrics:
      enabled: true
    # Tell SCDF we are running on Kubernetes platform
    kubernetes:
      enabled: true

  # Prometheus metrics injection (ServiceMonitor-compatible)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: scdf
      labels:
        release: kube-prometheus-stack

  # SCDF server ingress (optional — enable if you want a UI hostname)
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    hostname: scdf.homelab
    tls: true

  # Extra environment variables forwarded to every managed stream app
  extraEnvVars:
    - name: SPRING_CLOUD_DATAFLOW_FEATURES_STREAMS_ENABLED
      value: "true"
    - name: SPRING_CLOUD_DATAFLOW_FEATURES_BATCH_ENABLED
      value: "true"

# ── Skipper (stream deployment orchestrator) ─────────────────────────────────
skipper:
  enabled: true
  replicaCount: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: scdf
      labels:
        release: kube-prometheus-stack

# ── Global Kubernetes deployment tweaks for managed apps ─────────────────────
# These become defaults for every stream/task launched by SCDF on this cluster.
deployer:
  kubernetes:
    environment-variables: "SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka.messaging.svc.cluster.local:9092"
    liveness-probe-delay: 120
    readiness-probe-delay: 60
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
