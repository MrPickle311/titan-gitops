# Temporary PVC for the openebs-hostpath -> longhorn migration of vault-0's
# data (PMT-048). Child of the `vault` ArgoCD Application (multi-source, see
# bootstrap/vault-app.yaml) so it's tracked/pruned alongside Vault itself,
# not a standalone manual resource. Delete this file (and the PVC) once the
# copy is done and data-vault-0 has been rebound to the new PV - see
# migration/vault-copy-pod.yaml for the copy step.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-vault-longhorn-temp
  namespace: security
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
