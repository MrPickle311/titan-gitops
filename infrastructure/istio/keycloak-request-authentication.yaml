apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: "https://keycloak.homelab/realms/master"
      jwksUri: "http://titan-keycloak-service.security.svc.cluster.local:8080/realms/master/protocol/openid-connect/certs"
      forwardOriginalToken: true
    - issuer: "https://keycloak.homelab/realms/titan"
      jwksUri: "http://titan-keycloak-service.security.svc.cluster.local:8080/realms/titan/protocol/openid-connect/certs"
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-keycloak-jwt-payment
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
    # Deny anything without a valid token issued by titan or master realm
    - to:
        - operation:
            hosts: ["payment.homelab"]
      when:
        - key: request.auth.claims[iss]
          notValues:
            - "https://keycloak.homelab/realms/titan"
            - "https://keycloak.homelab/realms/master"
    # Deny master-realm tokens that don't carry the admin group (ADMIN requirement)
    - to:
        - operation:
            hosts: ["payment.homelab"]
      when:
        - key: request.auth.claims[iss]
          values: ["https://keycloak.homelab/realms/master"]
        - key: request.auth.claims[groups]
          notValues: ["admin"]
