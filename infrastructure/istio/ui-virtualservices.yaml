apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd-ui
  namespace: istio-system
spec:
  hosts:
  - "argocd.homelab"
  gateways:
  - main-gateway
  http:
  - route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local
        port:
          number: 443
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: chaos-ui
  namespace: istio-system
spec:
  hosts:
  - "chaos.homelab"
  gateways:
  - main-gateway
  http:
  - match:
    - uri:
        prefix: /oauth2/
    route:
    - destination:
        host: oauth2-proxy.security.svc.cluster.local
        port:
          number: 4180
  - route:
    - destination:
        host: chaos-dashboard.chaos-mesh.svc.cluster.local
        port:
          number: 2333
---
