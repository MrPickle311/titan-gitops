# istiod has no sidecar of its own, so its plain HTTP fetch of Keycloak's
# JWKS gets hard-rejected by STRICT mTLS on this namespace - without this
# exception istiod falls back to a fake JWKS and every real JWT fails
# signature verification at the gateway. JWKS is public (just signing
# keys, no session data), so loosening only this port is safe.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: keycloak-jwks-port-exception
  namespace: security
spec:
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: titan-keycloak
      app.kubernetes.io/managed-by: keycloak-operator
  mtls:
    mode: STRICT
  portLevelMtls:
    "8080":
      mode: PERMISSIVE
