apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.23.0
    chart: cni
    helm:
      valuesObject:
        global:
          nativeNftables: true
        # Repair config MUST live under cni.repair, not top-level repair -
        # the latter is silently ignored (unknown key) and the chart falls
        # back to its default repairPods:true mode, which patches a broken
        # pod's networking in place instead of deleting it. That's why pods
        # stuck on istio-validation after a cluster reboot took minutes of
        # crash-looping to self-heal instead of being rescheduled in seconds.
        # deletePods:true + repairPods:false makes recovery fast; the chart
        # only supports one of the three repair modes active at a time.
        cni:
          repair:
            deletePods: true
            repairPods: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
