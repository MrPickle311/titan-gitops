apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-image-scan-script
  namespace: nexus
data:
  scan.sh: |
    #!/bin/sh
    set -e
    REGISTRY="10.96.100.2:8082"
    echo "=== Discovering repos in Nexus docker catalog ==="
    REPOS=$(wget -qO- "http://${REGISTRY}/v2/_catalog" | grep -oE '"[^"]+"' | tr -d '"' | grep -v repositories)
    for repo in $REPOS; do
      TAGS=$(wget -qO- "http://${REGISTRY}/v2/${repo}/tags/list" | grep -oE '"tags":\[[^]]*\]' | grep -oE '"[^"]+"' | tr -d '"' | grep -v tags)
      for tag in $TAGS; do
        echo "=== Scanning ${repo}:${tag} ==="
        trivy image --insecure --scanners vuln --severity HIGH,CRITICAL "${REGISTRY}/${repo}:${tag}" || echo "SCAN FAILED for ${repo}:${tag}"
      done
    done
    echo "=== Scan complete ==="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-image-scan
  namespace: nexus
spec:
  # Scans every image actually stored in Nexus (not running workloads -
  # see trivy-operator-app.yaml's vulnerabilityScannerEnabled: false).
  # Output goes to stdout, picked up by loki-promtail like every other
  # pod's logs - queryable in Grafana ({app="trivy-image-scan"}) without
  # needing new infra.
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: trivy-image-scan
        spec:
          restartPolicy: Never
          containers:
            - name: trivy
              image: aquasec/trivy:0.56.2
              command: ["/bin/sh", "/scripts/scan.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: trivy-cache
                  mountPath: /root/.cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
          volumes:
            - name: script
              configMap:
                name: trivy-image-scan-script
                defaultMode: 0755
            - name: trivy-cache
              emptyDir: {}
