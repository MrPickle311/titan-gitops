apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-cluster-tls
  namespace: databases
spec:
  secretName: redis-cluster-tls
  privateKey:
    encoding: PKCS8
  # Cluster bus (port 16379) is always mutual TLS between nodes,
  # independent of the client-facing authClients setting - each node
  # presents this same cert acting as both server AND client to its
  # peers, so it needs both EKUs or bus handshakes fail with
  # "sslv3 alert unsupported certificate".
  usages:
    - server auth
    - client auth
  dnsNames:
    - redis-redis-cluster
    - redis-redis-cluster.databases.svc
    - redis-redis-cluster.databases.svc.cluster.local
    - "*.redis-redis-cluster-headless"
    - "*.redis-redis-cluster-headless.databases.svc"
    - "*.redis-redis-cluster-headless.databases.svc.cluster.local"
  ipAddresses:
    - 10.0.0.161
    - 10.0.0.162
    - 10.0.0.163
    - 10.0.0.164
    - 10.0.0.165
    - 10.0.0.166
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
