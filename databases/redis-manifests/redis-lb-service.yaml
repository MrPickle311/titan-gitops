apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-leader-lb
  namespace: databases
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.0.0.156"
spec:
  type: LoadBalancer
  selector:
    app: redis-cluster-leader
    role: leader
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
