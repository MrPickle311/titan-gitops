apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: messaging
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: openebs-hostpath
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 3.8-IV0
    authorization:
      type: simple
      superUsers:
        - ANONYMOUS
        - kafka-internal-clients
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        configuration:
          brokerCertChainAndKey:
            secretName: kafka-broker-tls
            certificate: tls.crt
            key: tls.key
      # OAuth-authenticated listener, staged alongside the still-anonymous
      # `tls` listener above so nothing breaks while services migrate one
      # at a time. Once every internal service is confirmed working here,
      # the plain `tls` listener and ANONYMOUS superuser get removed.
      - name: oauth
        port: 9095
        type: internal
        tls: true
        configuration:
          brokerCertChainAndKey:
            secretName: kafka-broker-tls
            certificate: tls.crt
            key: tls.key
        authentication:
          type: oauth
          validIssuerUri: https://keycloak.homelab/realms/titan
          jwksEndpointUri: http://titan-keycloak-service.security.svc.cluster.local:8080/realms/titan/protocol/openid-connect/certs
          userNameClaim: clientId
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          bootstrap:
            loadBalancerIP: 10.0.0.160
          brokers:
            - broker: 0
              loadBalancerIP: 10.0.0.203
            - broker: 1
              loadBalancerIP: 10.0.0.204
            - broker: 2
              loadBalancerIP: 10.0.0.205
          brokerCertChainAndKey:
            secretName: kafka-external-tls
            certificate: tls.crt
            key: tls.key
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
