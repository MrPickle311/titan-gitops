# `dual-role` decommissioned (PMT-048: openebs-hostpath -> longhorn).
# Replaced by `kafka-cluster` pool below via a proper Strimzi migration:
# partition reassignment (all 58 partitions incl. __consumer_offsets moved
# broker-side) + KRaft controller quorum voter removal (kraft.version
# upgraded 0->1 to allow remove-controller; this cluster started static -
# scaling an existing pool's controller replicas to 0 WITHOUT first
# removing its voters from the quorum breaks controller majority, even
# though it looks harmless - learned this the hard way mid-migration).
# Old PVCs (data-0-kafka-dual-role-0/1/2, openebs-hostpath) deleted after
# confirming quorum={kafka-cluster-3,4,5} and all KafkaTopics Ready.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-cluster
  namespace: messaging
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: longhorn
        deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 3.8-IV0
    authorization:
      type: simple
    listeners:
      - name: oauth
        port: 9095
        type: internal
        tls: true
        configuration:
          brokerCertChainAndKey:
            secretName: kafka-broker-tls
            certificate: tls.crt
            key: tls.key
        authentication:
          type: oauth
          validIssuerUri: https://keycloak.homelab/realms/titan
          jwksEndpointUri: http://titan-keycloak-service.security.svc.cluster.local:8080/realms/titan/protocol/openid-connect/certs
          userNameClaim: client_id
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: oauth
          validIssuerUri: https://keycloak.homelab/realms/titan
          jwksEndpointUri: http://titan-keycloak-service.security.svc.cluster.local:8080/realms/titan/protocol/openid-connect/certs
          userNameClaim: client_id
        configuration:
          bootstrap:
            loadBalancerIP: 10.0.0.160
          brokers:
            - broker: 0
              loadBalancerIP: 10.0.0.203
            - broker: 1
              loadBalancerIP: 10.0.0.204
            - broker: 2
              loadBalancerIP: 10.0.0.205
          brokerCertChainAndKey:
            secretName: kafka-external-tls
            certificate: tls.crt
            key: tls.key
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
