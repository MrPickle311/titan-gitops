apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db-cluster
  namespace: databases
spec:
  instances: 2
  priorityClassName: platform-critical
  affinity:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  certificates:
    serverCASecret: homelab-ca-bundle
    serverTLSSecret: keycloak-db-cluster-server-tls
  monitoring:
    enablePodMonitor: true
  storage:
    size: 10Gi
    storageClass: "longhorn"
  bootstrap:
    initdb:
      database: keycloak
      owner: app
