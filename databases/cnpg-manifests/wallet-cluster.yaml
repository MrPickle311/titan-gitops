apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wallet-db-cluster
  namespace: databases
spec:
  instances: 2
  monitoring:
    enablePodMonitor: true
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: wallet-db-cluster-rw-lb
            spec:
              type: LoadBalancer
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
  storage:
    size: 10Gi
    storageClass: "openebs-hostpath"
  bootstrap:
    initdb:
      database: wallet_db
      owner: app
