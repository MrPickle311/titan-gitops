apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: export-db-cluster
  namespace: databases
spec:
  instances: 2
  certificates:
    serverCASecret: homelab-ca-bundle
    serverTLSSecret: export-db-cluster-server-tls
  monitoring:
    enablePodMonitor: true
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: export-db-cluster-rw-lb
            spec:
              type: LoadBalancer
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
  storage:
    size: 20Gi
    storageClass: "openebs-hostpath"
  bootstrap:
    initdb:
      database: payment_batch_db
      owner: app
