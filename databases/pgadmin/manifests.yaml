apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: databases
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Titan DB",
          "Group": "Servers",
          "Host": "postgres-postgresql.databases.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "SSLMode": "prefer",
          "PassFile": "/pgpass/pgpass"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      initContainers:
      - name: create-pgpass
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          echo "postgres-postgresql.databases.svc.cluster.local:5432:*:postgres:${DB_PASSWORD}" > /pgpass/pgpass
          chmod 0600 /pgpass/pgpass
          chown 5050:5050 /pgpass/pgpass
          chown -R 5050:5050 /var/lib/pgadmin
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        volumeMounts:
        - name: pgpass-vol
          mountPath: /pgpass
        - name: data
          mountPath: /var/lib/pgadmin
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          valueFrom:
            secretKeyRef:
              name: pgadmin-credentials
              key: admin-email
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgadmin-credentials
              key: admin-password
        - name: PGADMIN_CONFIG_X_FRAME_OPTIONS
          value: "''"
        - name: PGADMIN_SERVER_JSON_FILE
          value: "/pgadmin4/servers.json"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgadmin
        - name: pgadmin-servers
          mountPath: /pgadmin4/servers.json
          subPath: servers.json
        - name: pgpass-vol
          mountPath: /pgpass
      volumes:
      - name: data
        emptyDir: {}
      - name: pgadmin-servers
        configMap:
          name: pgadmin-servers
      - name: pgpass-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: databases
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: pgadmin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: databases
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
spec:
  tls:
    - hosts:
        - pgadmin.homelab
      secretName: pgadmin-tls-secret
  rules:
  - host: pgadmin.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin
            port:
              number: 80
