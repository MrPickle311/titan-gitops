apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://strimzi.io/charts/'
    targetRevision: 0.44.0
    chart: strimzi-kafka-operator
    helm:
      values: |
        watchAnyNamespace: false
        watchNamespaces:
          - messaging
          - operators
        resources:
          limits:
            memory: 1024Mi
            cpu: 1000m
          requests:
            memory: 512Mi
            cpu: 200m
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
