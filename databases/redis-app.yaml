apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 13.0.4
    chart: redis-cluster
    helm:
      values: |
        image:
          repository: bitnamilegacy/redis-cluster
          tag: 8.2.1-debian-12-r0

        cluster:
          nodes: 6
          replicas: 1
          externalAccess:
            enabled: true
            service:
              type: LoadBalancer
              loadBalancerIP: ["10.0.0.151", "10.0.0.152", "10.0.0.153", "10.0.0.154", "10.0.0.155", "10.0.0.156"]

        usePassword: true
        existingSecret: "redis-cluster-credentials"
        existingSecretPasswordKey: "redis-password"

        persistence:
          enabled: true
          storageClass: "openebs-hostpath"
          size: 5Gi

        redis:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true