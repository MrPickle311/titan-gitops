apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 13.0.4
    chart: redis-cluster
    helm:
      values: |
        image:
          repository: bitnamilegacy/redis-cluster
          tag: 8.2.1-debian-12-r0

        cluster:
          nodes: 6
          replicas: 1
          externalAccess:
            enabled: false

        usePassword: true
        existingSecret: "redis-cluster-credentials"
        existingSecretPasswordKey: "redis-password"

        tls:
          enabled: true
          authClients: false
          existingSecret: "redis-cluster-tls"
          certFilename: "tls.crt"
          certKeyFilename: "tls.key"
          certCAFilename: "ca.crt"

        persistence:
          enabled: true
          storageClass: "openebs-hostpath"
          size: 5Gi

        redis:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraEnvVars:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_CLUSTER_ANNOUNCE_HOSTNAME
              value: "$(MY_POD_NAME).redis-redis-cluster-headless.databases.svc.cluster.local"
            - name: REDIS_CLUSTER_PREFERRED_ENDPOINT_TYPE
              value: "hostname"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true