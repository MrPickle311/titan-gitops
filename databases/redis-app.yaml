apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 13.0.4
    chart: redis-cluster
    helm:
      values: |
        image:
          repository: bitnamilegacy/redis-cluster
          tag: 8.2.1-debian-12-r0

        cluster:
          nodes: 6
          replicas: 1
          externalAccess:
            enabled: true
            service:
              type: LoadBalancer
              loadBalancerIP: ["10.0.0.161", "10.0.0.162", "10.0.0.163", "10.0.0.164", "10.0.0.165", "10.0.0.166"]

        usePassword: true
        existingSecret: "redis-cluster-credentials"
        existingSecretPasswordKey: "redis-password"

        tls:
          enabled: true
          authClients: false
          existingSecret: "redis-cluster-tls"
          certFilename: "tls.crt"
          certKeyFilename: "tls.key"
          certCAFilename: "ca.crt"

        persistence:
          enabled: true
          storageClass: "openebs-hostpath"
          size: 5Gi

        redis:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraEnvVars:
            - name: REDIS_ACL_FX_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-acl-users
                  key: fx-service
            - name: REDIS_ACL_PAYMENT_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-acl-users
                  key: payment-service
          lifecycleHooks:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -h localhost -p $REDIS_TLS_PORT_NUMBER -a "$(cat $REDIS_PASSWORD_FILE)" --no-auth-warning PING && break
                      sleep 2
                    done
                    redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -h localhost -p $REDIS_TLS_PORT_NUMBER -a "$(cat $REDIS_PASSWORD_FILE)" --no-auth-warning \
                      ACL SETUSER fx-service on ">$REDIS_ACL_FX_SERVICE_PASSWORD" resetchannels "~fx-conversion-rates" +@all -@admin -@dangerous
                    redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -h localhost -p $REDIS_TLS_PORT_NUMBER -a "$(cat $REDIS_PASSWORD_FILE)" --no-auth-warning \
                      ACL SETUSER payment-service on ">$REDIS_ACL_PAYMENT_SERVICE_PASSWORD" resetchannels "~fx-conversion-rates" "~sanctioned-user-ids::all" +@all -@admin -@dangerous
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true