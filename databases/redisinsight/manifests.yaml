apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
      - name: redisinsight
        image: redis/redisinsight:2.60.0
        ports:
        - containerPort: 5540
        env:
        - name: RI_ENCRYPTION_KEY
          value: "randomencryptionkey1234567890"
        - name: RI_ACCEPT_TERMS_AND_CONDITIONS
          value: "true"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-credentials
              key: redis-password
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "const http = require('http'); const options = { hostname: '127.0.0.1', port: 5540, path: '/api/databases', method: 'GET' }; const tryAdd = () => { const req = http.request(options, res => { if (res.statusCode !== 200) { setTimeout(tryAdd, 2000); return; } let body = ''; res.on('data', d => body += d); res.on('end', () => { try { const dbs = JSON.parse(body); if (dbs.some(db => db.host === 'redis-redis-cluster.databases.svc.cluster.local')) { process.exit(0); } else { const postData = JSON.stringify({ host: 'redis-redis-cluster.databases.svc.cluster.local', port: 6379, name: 'Titan Redis Cluster', password: process.env.REDIS_PASSWORD }); const postOpt = { ...options, method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(postData) } }; const postReq = http.request(postOpt, postRes => { if (postRes.statusCode === 201) process.exit(0); else setTimeout(tryAdd, 2000); }); postReq.write(postData); postReq.end(); } } catch (e) { setTimeout(tryAdd, 2000); } }); }); req.on('error', () => setTimeout(tryAdd, 2000)); req.end(); }; tryAdd();" > /tmp/add-db.js && node /tmp/add-db.js

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: db
          mountPath: /data
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: redisinsight-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-data
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: databases
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5540
  selector:
    app: redisinsight
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight
  namespace: databases
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  tls:
    - hosts:
        - redis-insight.homelab
      secretName: redisinsight-tls-secret
  rules:
  - host: redis-insight.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redisinsight
            port:
              number: 80