apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://aquasecurity.github.io/helm-charts/'
    targetRevision: 0.35.0
    chart: trivy-operator
    helm:
      values: |
        # Scans every namespace's running workload images continuously
        # (VulnerabilityReport CRs), which naturally covers what
        # applications/databases/messaging actually pull from Nexus - a
        # better fit than scanning Nexus's docker catalog directly, since
        # it reflects what's actually deployed (PMT-048 harbor->nexus
        # migration follow-up).
        targetNamespaces: ""
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
        trivy:
          ignoreUnfixed: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
