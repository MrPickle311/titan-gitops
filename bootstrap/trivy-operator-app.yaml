apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://aquasecurity.github.io/helm-charts/'
    targetRevision: 0.35.0
    chart: trivy-operator
    helm:
      values: |
        targetNamespaces: ""
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
        trivy:
          ignoreUnfixed: false
        # Only scan Nexus's actual image catalog (see the trivy-image-scan
        # CronJob in infrastructure/nexus), not every running pod's image -
        # user wants image-repo scanning, not per-workload scanning.
        # `operator.vulnerabilityScannerEnabled: false` alone does NOT
        # actually stop this - confirmed live: the operator's periodic
        # reconcile loop keeps backfilling scan jobs for any pod missing a
        # VulnerabilityReport regardless of that flag (real chart
        # limitation in 0.35.0, not a config mistake - verified new scan
        # pods kept spawning with fresh names minutes after the flag was
        # set and confirmed live in the ConfigMap). The only reliable stop
        # is not running the controller at all.
        operator:
          vulnerabilityScannerEnabled: false
          replicas: 0
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
