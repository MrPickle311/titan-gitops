apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://argoproj.github.io/argo-helm'
    targetRevision: 0.41.11
    chart: argo-workflows
    helm:
      values: |
        server:
          secure: false
          authModes:
            - server
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "homelab-ca-issuer"
            hosts:
              - workflows.homelab
            tls:
              - secretName: workflows-tls
                hosts:
                  - workflows.homelab
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
