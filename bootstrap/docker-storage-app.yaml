apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/MrPickle311/titan-gitops.git'
    targetRevision: HEAD
    path: infrastructure/docker-storage
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  # automated fully removed (not just selfHeal:false) for the
  # openebs-hostpath -> longhorn registry-pvc migration (PMT-048) - selfHeal
  # alone still auto-heals drift-without-a-commit, reverting a manual
  # `kubectl scale --replicas=0` on docker-registry. Manual sync only until
  # done, then restore:
  #   syncPolicy:
  #     automated:
  #       prune: true
  #       selfHeal: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
