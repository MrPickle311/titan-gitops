apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edp-keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/MrPickle311/titan-gitops.git'
    targetRevision: HEAD
    path: infrastructure/edp-keycloak
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
