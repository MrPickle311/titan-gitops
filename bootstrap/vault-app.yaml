apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
  project: default
  sources:
    - repoURL: 'https://helm.releases.hashicorp.com'
      targetRevision: 0.28.1
      chart: vault
      helm:
        values: |
          server:
            dataStorage:
              enabled: true
              size: 2Gi
              storageClass: openebs-hostpath
            standalone:
              enabled: true
            ingress:
              enabled: false
          ui:
            enabled: true
            serviceType: ClusterIP
    - repoURL: 'https://github.com/MrPickle311/titan-gitops.git'
      targetRevision: HEAD
      path: infrastructure/vault
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: security
  # syncPolicy.automated fully removed (not just selfHeal:false) for the
  # openebs-hostpath -> longhorn PVC migration (PMT-048). selfHeal:false alone
  # wasn't enough - ArgoCD auto-syncs on ANY new commit regardless of
  # selfHeal (that flag only covers drift-without-a-commit), so even pushing
  # this exact change would've re-triggered a sync and put the StatefulSet's
  # replica count back to 1 over `kubectl scale --replicas=0`. Manual sync
  # only until the migration's done, then restore:
  #   syncPolicy:
  #     automated:
  #       prune: true
  #       selfHeal: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
