apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    # volumeClaimTemplates is immutable post-creation on an existing
    # StatefulSet - changing the Helm value's storageClass alone would make
    # every sync try (and fail) to patch it. The actual data-vault-0 PVC is
    # already manually on longhorn (PMT-048, PV retain+rebind) - ignoring
    # the diff here lets the Helm value keep declaring the real intent
    # without ArgoCD ever attempting the forbidden patch.
    - group: apps
      kind: StatefulSet
      name: vault
      jqPathExpressions:
        - '.spec.volumeClaimTemplates'
  project: default
  sources:
    - repoURL: 'https://helm.releases.hashicorp.com'
      targetRevision: 0.28.1
      chart: vault
      helm:
        values: |
          server:
            dataStorage:
              enabled: true
              size: 2Gi
              storageClass: longhorn
            standalone:
              enabled: true
            ingress:
              enabled: false
          ui:
            enabled: true
            serviceType: ClusterIP
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: security
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
