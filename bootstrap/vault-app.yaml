apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://helm.releases.hashicorp.com'
    targetRevision: 0.28.1
    chart: vault
    helm:
      values: |
        server:
          dataStorage:
            enabled: true
            size: 2Gi
            storageClass: openebs-hostpath
          standalone:
            enabled: true
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
