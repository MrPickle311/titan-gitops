apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
      - name: redisinsight
        image: redis/redisinsight:2.60.0
        ports:
        - containerPort: 5540
        env:
        - name: RI_ENCRYPTION_KEY
          value: "randomencryptionkey1234567890"
        - name: RI_ACCEPT_TERMS_AND_CONDITIONS
          value: "true"

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: db
          mountPath: /data
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: redisinsight-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-data
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: databases
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5540
  selector:
    app: redisinsight
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redisinsight
  namespace: databases
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
spec:
  tls:
    - hosts:
        - redis-insight.homelab
      secretName: redisinsight-tls-secret
  rules:
  - host: redis-insight.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redisinsight
            port:
              number: 80