apiVersion: apps/v1
kind: Deployment
metadata:
  name: fee-service
  namespace: applications
  labels:
    app: fee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fee-service
  template:
    metadata:
      labels:
        app: fee-service
    spec:
      volumes:
        - name: pyroscope-agent
          emptyDir: {}
      initContainers:
        - name: fetch-otel-pyroscope
          image: busybox:latest
          command:
            - sh
            - -c
            - "wget -O /agent/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar && wget -O /agent/pyroscope-otel.jar https://github.com/grafana/otel-profiling-java/releases/latest/download/pyroscope-otel.jar && wget -O /agent/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/latest/download/pyroscope.jar"
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /agent
      containers:
      - name: fee-service
        image: registry.homelab/fee-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9091
        volumeMounts:
          - name: pyroscope-agent
            mountPath: /agent
        env:
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "*"
        - name: MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES
          value: "ALWAYS"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/agent/pyroscope.jar -javaagent:/agent/opentelemetry-javaagent.jar"
        - name: OTEL_JAVAAGENT_EXTENSIONS
          value: "/agent/pyroscope-otel.jar"
        - name: OTEL_PYROSCOPE_START_PROFILING
          value: "true"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_URL
          value: "false"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_BASELINE_URL
          value: "false"
        - name: OTEL_SERVICE_NAME
          value: "fee-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo.monitoring.svc.cluster.local:4318"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: LOGGING_PATTERN_LEVEL
          value: "trace_id=%X{trace_id} span_id=%X{span_id} %5p"
        - name: PYROSCOPE_APPLICATION_NAME
          value: "fee-service"
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://pyroscope.monitoring.svc.cluster.local:4040"
        - name: PYROSCOPE_FORMAT
          value: "jfr"
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: "1ms"
        - name: PYROSCOPE_PROFILER_EVENT
          value: "wall"
        - name: PYROSCOPE_PROFILER_LOCK
          value: "10ms"
        - name: PYROSCOPE_PROFILER_ALLOC
          value: "128k"
        - name: PYROSCOPE_LOG_LEVEL
          value: "info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PYROSCOPE_LABELS
          value: "pod=$(POD_NAME),service_name=fee-service"
---
apiVersion: v1
kind: Service
metadata:
  name: fee-service
  namespace: applications
  labels:
    app: fee-service
spec:
  selector:
    app: fee-service
  ports:
  - name: grpc
    port: 9091
    targetPort: 9091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fee-service-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  tls:
    - hosts:
        - fee.homelab
      secretName: fee-tls-secret
  rules:
  - host: fee.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fee-service
            port:
              number: 9091

