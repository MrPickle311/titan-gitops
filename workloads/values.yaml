          value: fx-service
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: 1ms
        - name: PYROSCOPE_PROFILER_ALLOC
          value: 128k
        - name: PYROSCOPE_LABELS
          value: pod=$(POD_NAME),service_name=fx-service
        - name: REDIS_HOST
          value: redis-redis-cluster.databases.svc.cluster.local
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_CLUSTER_NODES
          value: redis-redis-cluster.databases.svc.cluster.local:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-credentials
              key: redis-password
              optional: false
    service:
      ports:
      - name: grpc
        port: 9091
        targetPort: 9091
    ingress:
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: homelab-ca-issuer
        nginx.ingress.kubernetes.io/backend-protocol: GRPC
      tls:
      - hosts:
        - fx.homelab
