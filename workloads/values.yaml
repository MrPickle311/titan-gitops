apps:
  sanctions-service:
    telemetry: true
    deployments:
      sanctions-service:
        replicas: 1
        image: registry.homelab/sanctions-service:latest
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        port: 9091
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -javaagent:/opt/byteman/lib/byteman.jar=listener:true,port:9288,address:0.0.0.0
            -javaagent:/agent/pyroscope.jar -javaagent:/agent/opentelemetry-javaagent.jar
        - name: OTEL_SERVICE_NAME
          value: sanctions-service
        - name: PYROSCOPE_APPLICATION_NAME
          value: sanctions-service
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: 1ms
        - name: PYROSCOPE_PROFILER_ALLOC
          value: 128k
        - name: PYROSCOPE_LABELS
          value: pod=$(POD_NAME),service_name=sanctions-service
    service:
      ports:
      - name: grpc
        port: 9091
        targetPort: 9091
    ingress:
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: homelab-ca-issuer
        nginx.ingress.kubernetes.io/backend-protocol: GRPC
      tls:
      - hosts:
        - sanctions.homelab
        secretName: sanctions-tls-secret
      rules:
      - host: sanctions.homelab
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sanctions-service
                port:
                  number: 9091
      _name_suffix: -ingress
    serviceMonitor: null
  fx-service:
    telemetry: true
    deployments:
      fx-service:
        replicas: 1
        image: registry.homelab/fx-service:latest
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
