          requests:
            cpu: 150m
            memory: 320Mi
          limits:
            cpu: 750m
            memory: 768Mi
        hpa:
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
        env:
        - name: SERVER_PORT
          value: '8080'
        - name: LANG
          value: C.UTF-8
        - name: LC_ALL
          value: C.UTF-8
        - name: REDIS_HOST
          value: redis-redis-cluster.databases.svc.cluster.local
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_CLUSTER_NODES
          value: redis-redis-cluster.databases.svc.cluster.local:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-credentials
              key: redis-password
              optional: false
        - name: SPRING_DATA_REDIS_USERNAME
          value: default
    service:
      ports:
      - name: grpc
        port: 9091
        targetPort: 9091
      - name: http
        port: 8080
        targetPort: 8080
    ingress:
      ingressType: grpc
      port: 9091
    serviceMonitor: null
