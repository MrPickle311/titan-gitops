              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-kafka-bootstrap.messaging.svc.cluster.local:9092
        - name: EXPORT_REGULATORY_URL
          value: http://mock-regulatory-service:8084/api/v1/regulatory/report
        - name: EXPORT_MAX_RETRY_COUNT
          value: '50'
      export-batch-retry-manager:
        labels:
          component: retry-manager
        replicas: 1
        image: registry.homelab/export-batch-service:latest
        port: 8083
        podLabels:
          sidecar.istio.io/inject: "true"
        resources:
          requests:
            cpu: 250m
            memory: 448Mi
          limits:
            cpu: 1500m
            memory: 1280Mi
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://export-db-cluster-rw.databases:5432/payment_batch_db
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: export-db-cluster-app
              key: username
        - name: SPRING_PROFILES_ACTIVE
          value: retry-manager
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: export-db-cluster-app
              key: password
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-kafka-bootstrap.messaging.svc.cluster.local:9092
        - name: EXPORT_REGULATORY_URL
          value: http://mock-regulatory-service:8084/api/v1/regulatory/report
        - name: EXPORT_MAX_RETRY_COUNT
          value: '50'
    service:
      ports:
      - name: http
        port: 8083
        targetPort: 8083
    ingress:
      ingressType: http
      port: 8083
