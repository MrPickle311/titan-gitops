apps:
  sanctions-service:
    telemetry: true
    prometheusScrape: true
    pdb:
      minAvailable: 1
    authz:
      allowedCallers:
      - payment-service
    deployments:
      sanctions-service:
        image: registry.homelab/sanctions-service:latest
        port: 9091
        podLabels:
          sidecar.istio.io/inject: "true"
        resources:
          requests:
            cpu: 150m
            memory: 320Mi
          limits:
            cpu: 750m
            memory: 768Mi
        hpa:
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70
        env:
        - name: SERVER_PORT
          value: '8080'
    service:
      ports:
      - name: grpc
        port: 9091
        targetPort: 9091
      - name: http
        port: 8080
        targetPort: 8080
    ingress:
      ingressType: grpc
      port: 9091
    serviceMonitor: null
  fx-service:
    telemetry: true
    prometheusScrape: true
    pdb:
      minAvailable: 1
    authz:
      allowedCallers:
      - payment-service
    deployments:
      fx-service:
        image: registry.homelab/fx-service:latest
        port: 9091
