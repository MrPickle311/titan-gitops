commonEnv:
- name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
  value: '*'
- name: MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES
  value: ALWAYS
- name: OTEL_EXPORTER_OTLP_ENDPOINT
  value: http://tempo.monitoring.svc.cluster.local:4318
- name: OTEL_LOGS_EXPORTER
  value: none
- name: OTEL_METRICS_EXPORTER
  value: none
- name: LOGGING_PATTERN_LEVEL
  value: trace_id=%X{trace_id} span_id=%X{span_id} %5p
- name: PYROSCOPE_SERVER_ADDRESS
  value: http://pyroscope.monitoring.svc.cluster.local:4040
- name: PYROSCOPE_FORMAT
  value: jfr
- name: PYROSCOPE_PROFILER_EVENT
  value: wall
- name: PYROSCOPE_PROFILER_LOCK
  value: 10ms
- name: PYROSCOPE_LOG_LEVEL
  value: info
- name: POD_NAME
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
global:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  ingressAnnotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
  ingressAnnotationsHttp:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/configuration-snippet: 'proxy_hide_header X-Frame-Options;

      proxy_hide_header Content-Security-Policy;

      '
