{{/*
Services with a serviceMonitor also get a rule scoped to /actuator/prometheus,
restricted to Prometheus's own identity (it's meshed - see
metrics/templates/prometheus-stack.yaml podMetadata - so it has a real principal
to allow-list, same as everything else here). Everything else on the service
stays restricted to allowedCallers.
*/}}
{{- range $appKey, $app := .Values.apps }}
{{- if $app.authz }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $appKey }}
  namespace: applications
spec:
  selector:
    matchLabels:
      app: {{ $appKey }}
  action: ALLOW
  rules:
  {{- if $app.authz.allowedCallers }}
  - from:
    - source:
        principals:
        {{- range $app.authz.allowedCallers }}
        {{- if eq . "istio-ingressgateway" }}
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
        {{- else }}
        - "cluster.local/ns/applications/sa/{{ . }}"
        {{- end }}
        {{- end }}
  {{- end }}
  {{- if $app.serviceMonitor }}
  - from:
    - source:
        principals:
        - "cluster.local/ns/monitoring/sa/kube-prometheus-stack-prometheus"
    to:
    - operation:
        paths:
        - /actuator/prometheus
  {{- end }}
{{- end }}
{{- end }}
