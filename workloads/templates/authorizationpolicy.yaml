{{/*
Dry-run only (istio.io/dry-run: "true"): Envoy evaluates and logs a shadow ALLOW/DENY
verdict per request but never rejects real traffic.

Services with a serviceMonitor also get an open rule for /actuator/prometheus: that
endpoint shares the app's main port, and Prometheus itself is unmeshed (no mTLS
identity to allow-list by principal), so it's scoped open by path instead - the
endpoint is read-only, non-sensitive, and everything else on the service stays
restricted to allowedCallers.
*/}}
{{- range $appKey, $app := .Values.apps }}
{{- if $app.authz }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $appKey }}
  namespace: applications
  annotations:
    istio.io/dry-run: "true"
spec:
  selector:
    matchLabels:
      app: {{ $appKey }}
  action: ALLOW
  rules:
  {{- if $app.authz.allowedCallers }}
  - from:
    - source:
        principals:
        {{- range $app.authz.allowedCallers }}
        {{- if eq . "istio-ingressgateway" }}
        - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
        {{- else }}
        - "cluster.local/ns/applications/sa/{{ . }}"
        {{- end }}
        {{- end }}
  {{- end }}
  {{- if $app.serviceMonitor }}
  - to:
    - operation:
        paths:
        - /actuator/prometheus
  {{- end }}
{{- end }}
{{- end }}
