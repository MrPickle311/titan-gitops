{{- range $appKey, $app := .Values.apps }}
{{- if $app.ingress }}
{{- $baseName := trimPrefix "mock-" (trimSuffix "-service" $appKey) }}
{{- $hostName := printf "%s.homelab" $baseName }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ $appKey }}
  namespace: applications
spec:
  hosts:
  - {{ $hostName }}
  gateways:
  - istio-system/main-gateway
  http:
  - route:
    - destination:
        host: {{ $appKey }}
        port:
          number: {{ $app.ingress.port }}
{{- end }}
{{- end }}
