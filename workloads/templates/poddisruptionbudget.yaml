{{- range $appKey, $app := .Values.apps }}
{{- if $app.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $appKey }}
  namespace: applications
  labels:
    app: {{ $appKey }}
spec:
  minAvailable: {{ $app.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ $appKey }}
{{- end }}
{{- end }}
