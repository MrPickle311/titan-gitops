apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-fx-failure-and-redis-rates-are-cleaned-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: inject-chaos-fx
        template: apply-chaos-fx
    - - arguments:
          parameters:
          - name: sleep-duration
            value: '25'
        name: backup-and-clear-redis
        templateRef:
          name: common-test-steps
          template: backup-and-clear-redis
    - - arguments: {}
        name: run-test
        template: test-payment
    - - name: validate-db
        templateRef:
          name: common-test-steps
          template: validate-db
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
    - - name: validate-kafka
        templateRef:
          name: common-test-steps
          template: validate-kafka
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
  - inputs: {}
    metadata: {}
    name: apply-chaos-fx
    outputs: {}
    resource:
      action: create
      manifest: |
        kind: PodChaos
        apiVersion: chaos-mesh.org/v1alpha1
        metadata:
          namespace: applications
          name: isolate-fx-service
        spec:
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: fx-service
          mode: all
          action: pod-failure
  - container:
      args:
      - |
        apk add --no-cache curl jq
        TX_ID="tx-$RANDOM"
        SRC_USER="1$RANDOM$RANDOM"
        TGT_USER="2$RANDOM$RANDOM"
        echo "1. Create payment..."
        RES=$(curl -s -X POST http://payment-service:8080/api/payments \
          -H "Content-Type: application/json" \
          -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

        ID=$(echo $RES | jq -r '.id')
        echo "ID: $ID"
        echo "$ID" > /tmp/payment_id.txt

        echo "2. Execute payment..."
        curl -s -X POST http://payment-service:8080/api/payments/$ID/execute

        echo "3. Waiting up to 30s for payment to reach terminal state..."
        for i in $(seq 1 15); do
          STATE=$(curl -s http://payment-service:8080/api/payments/$ID | jq -r '.state')
          if [ "$STATE" = "FAILED" ] || [ "$STATE" = "COMPLETED" ]; then
            break
          fi
          sleep 2
        done

        echo "4. Validate API state..."
        echo "State: $STATE"

        if [ "$STATE" != "FAILED" ]; then
          echo "Error: Not failed. Was: $STATE"
          exit 1
        fi
        echo "API check OK"
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      resources: {}
    inputs: {}
    metadata: {}
    name: test-payment
    outputs:
      parameters:
      - name: payment-id
        valueFrom:
          path: /tmp/payment_id.txt
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - arguments: {}
        name: remove-chaos-fx
        template: delete-chaos-fx
    - - arguments: {}
        name: restore-redis
        templateRef:
          name: common-test-steps
          template: restore-redis
  - inputs: {}
    metadata: {}
    name: delete-chaos-fx
    outputs: {}
    resource:
      action: delete
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: isolate-fx-service
          namespace: applications
