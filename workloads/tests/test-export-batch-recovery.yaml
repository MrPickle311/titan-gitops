apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-export-batch-recovery
  namespace: applications
spec:
  entrypoint: main
  onExit: cleanup
  templates:
    - name: main
      steps:
        - - name: apply-chaos
            template: apply-chaos-regulatory

        - - name: create-failing-payment
            templateRef:
              name: test-payment-template
              template: test-payment
            
        - - name: wait-for-p1-to-fail
            template: wait-for-export-status
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.create-failing-payment.outputs.parameters.payment-id}}'
                - name: expected-status
                  value: 'FAILED'

        - - name: remove-chaos
            template: remove-chaos-regulatory

        - - name: create-successful-payment
            templateRef:
              name: test-payment-template
              template: test-payment

        - - name: wait-for-p2-to-succeed
            template: wait-for-export-status
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.create-successful-payment.outputs.parameters.payment-id}}'
                - name: expected-status
                  value: 'EXPORTED'

        - - name: wait-for-p1-to-recover
            template: wait-for-export-status
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.create-failing-payment.outputs.parameters.payment-id}}'
                - name: expected-status
                  value: 'EXPORTED'

    - name: apply-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - |
            cat <<EOF | kubectl apply -f -
            apiVersion: chaos-mesh.org/v1alpha1
            kind: PodChaos
            metadata:
              name: regulatory-service-failure
              namespace: applications
            spec:
              action: pod-failure
              mode: all
              selector:
                namespaces:
                  - applications
                labelSelectors:
                  app: mock-regulatory-service
            EOF

    - name: remove-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - "kubectl delete podchaos regulatory-service-failure -n applications --ignore-not-found"

    - name: wait-for-export-status
      inputs:
        parameters:
          - name: payment-id
          - name: expected-status
      container:
        image: postgres:alpine
        command: [sh, -c]
        args:
          - |
            export PGPASSWORD=$DB_PASSWORD
            echo "Waiting for payment {{inputs.parameters.payment-id}} to reach {{inputs.parameters.expected-status}}..."
            for i in $(seq 1 120); do
              COUNT=$(psql -h export-db-cluster-rw.databases.svc.cluster.local -U $DB_USER -d payment_batch_db -t -c "SELECT count(*) FROM payment_export_staging WHERE status='{{inputs.parameters.expected-status}}' AND payment_id={{inputs.parameters.payment-id}} AND created_at >= NOW() - INTERVAL '5 minutes';" | xargs)
              if [ "$COUNT" -gt 0 ]; then
                echo "Success: Found {{inputs.parameters.expected-status}} payment in staging!"
                psql -h export-db-cluster-rw.databases.svc.cluster.local -U $DB_USER -d payment_batch_db -c "SELECT id, payment_id, status, retry_count, created_at, exported_at FROM payment_export_staging WHERE payment_id={{inputs.parameters.payment-id}} AND created_at >= NOW() - INTERVAL '5 minutes';"
                exit 0
              fi
              sleep 2
            done
            echo "Error: Did not find {{inputs.parameters.expected-status}} payment export"
            exit 1
        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: export-db-cluster-app
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: export-db-cluster-app

    - name: cleanup
      steps:
        - - name: remove-chaos
            template: remove-chaos-regulatory
