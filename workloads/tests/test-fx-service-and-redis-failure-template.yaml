apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-fx-service-and-redis-failure-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: inject-chaos-fx
        template: apply-chaos-fx
      - arguments: {}
        name: inject-chaos-redis
        template: apply-chaos-redis
    - - arguments: {}
        name: run-test
        template: test-payment
  - inputs: {}
    metadata: {}
    name: apply-chaos-fx
    outputs: {}
    resource:
      action: create
      manifest: "kind: PodChaos\napiVersion: chaos-mesh.org/v1alpha1\nmetadata:\n\
        \  namespace: applications\n  name: fail-fx-service-pods\nspec:\n  selector:\n\
        \    namespaces:\n      - applications\n    labelSelectors:\n      app: fx-service\n\
        \  mode: all\n  action: pod-failure\n"
  - inputs: {}
    metadata: {}
    name: apply-chaos-redis
    outputs: {}
    resource:
      action: create
      manifest: "apiVersion: chaos-mesh.org/v1alpha1\nkind: PodChaos\nmetadata:\n\
        \  name: fail-redis-pods\n  namespace: databases\nspec:\n  action: pod-failure\n\
        \  mode: all\n  selector:\n    labelSelectors:\n      \"app.kubernetes.io/name\"\
        : \"redis-cluster\"\n"
  - container:
      args:
      - "apk add --no-cache curl jq\nTX_ID=\"tx-$RANDOM\"\nSRC_USER=\"1$RANDOM$RANDOM\"\
        \nTGT_USER=\"2$RANDOM$RANDOM\"\necho \"1. Create payment...\"\nRES=$(curl\
        \ -s -X POST http://payment-service:8080/api/payments \\\n  -H \"Content-Type:\
        \ application/json\" \\\n  -d \"{\\\"transactionId\\\": \\\"$TX_ID\\\", \\\
        \"amount\\\": \\\"150.00\\\", \\\"currency\\\": \\\"USD\\\", \\\"sourceUserId\\\
        \": $SRC_USER, \\\"targetUserId\\\": $TGT_USER, \\\"sourceCurrency\\\": \\\
        \"USD\\\", \\\"targetCurrency\\\": \\\"EUR\\\"}\")\n\nID=$(echo $RES | jq\
        \ -r '.id')\necho \"ID: $ID\"\n\necho \"2. Execute payment...\"\ncurl -s -X\
        \ POST http://payment-service:8080/api/payments/$ID/execute\n\necho \"3. Wait\
        \ 15s (Chaos active)...\"\nsleep 15\n\necho \"4. Validate state...\"\nSTATE=$(curl\
        \ -s http://payment-service:8080/api/payments/$ID | jq -r '.state')\necho\
        \ \"State: $STATE\"\n\nif [ \"$STATE\" != \"FAILED\" ]; then\n  echo \"Error:\
        \ Not failed. Was: $STATE\"\n  exit 1\nfi\necho \"OK\"\n"
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      resources: {}
    inputs: {}
    metadata: {}
    name: test-payment
    outputs: {}
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - arguments: {}
        name: remove-chaos-fx
        template: delete-chaos-fx
      - arguments: {}
        name: remove-chaos-redis
        template: delete-chaos-redis
  - inputs: {}
    metadata: {}
    name: delete-chaos-fx
    outputs: {}
    resource:
      action: delete
      manifest: "apiVersion: chaos-mesh.org/v1alpha1\nkind: PodChaos\nmetadata:\n\
        \  name: fail-fx-service-pods\n  namespace: applications\n"
  - inputs: {}
    metadata: {}
    name: delete-chaos-redis
    outputs: {}
    resource:
      action: delete
      manifest: "apiVersion: chaos-mesh.org/v1alpha1\nkind: PodChaos\nmetadata:\n\
        \  name: fail-redis-pods\n  namespace: databases\n"
