apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-payment-redis-pods-failure-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: inject-chaos
        template: apply-chaos
    - - arguments: {}
        name: run-test
        template: test-payment
  - inputs: {}
    metadata: {}
    name: apply-chaos
    outputs: {}
    resource:
      action: create
      manifest: |
        kind: PodChaos
        apiVersion: chaos-mesh.org/v1alpha1
        metadata:
          namespace: databases
          name: redis-failure
          annotations:
            experiment.chaos-mesh.org/pause: 'true'
        spec:
          selector:
            namespaces:
              - databases
            labelSelectors:
              helm.sh/chart: redis-cluster-13.0.4
          mode: all
          action: pod-failure
  - container:
      args:
      - |
        apk add --no-cache curl jq

        TX_ID="tx-$RANDOM"
        SRC_USER="1$RANDOM$RANDOM"
        TGT_USER="2$RANDOM$RANDOM"
        echo "1. Create payment..."
        RES=$(curl -s -X POST http://payment-service:8080/api/payments \
          -H "Content-Type: application/json" \
          -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

        ID=$(echo $RES | jq -r '.id')
        echo "ID: $ID"

        echo "2. Execute payment..."
        curl -s -X POST http://payment-service:8080/api/payments/$ID/execute

        echo "3. Wait 15s (Chaos active)..."
        sleep 15

        echo "4. Validate state..."
        STATE=$(curl -s http://payment-service:8080/api/payments/$ID | jq -r '.state')
        echo "State: $STATE"

        if [ "$STATE" != "COMPLETED" ]; then
          echo "Error: Not completed. Was: $STATE"
          exit 1
        fi
        echo "OK"
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      resources: {}
    inputs: {}
    metadata: {}
    name: test-payment
    outputs: {}
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - arguments: {}
        name: remove-chaos
        template: delete-chaos
  - inputs: {}
    metadata: {}
    name: delete-chaos
    outputs: {}
    resource:
      action: delete
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: redis-failure
          namespace: databases
