apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-fee-service-charge-failure-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: inject-chaos
        templateRef:
          name: common-test-steps
          template: apply-chaos-wallet
    - - arguments: {}
        name: run-test
        template: test-payment
    - - name: validate-db
        templateRef:
          name: common-test-steps
          template: validate-db
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
          - name: expected-history-state
            value: FEE_FAILED
    - - name: validate-kafka
        templateRef:
          name: common-test-steps
          template: validate-kafka
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
  - container:
      args:
      - |
        apk add --no-cache curl jq
        TX_ID="tx-$RANDOM"
        SRC_USER="1$RANDOM$RANDOM"
        TGT_USER="2$RANDOM$RANDOM"
        echo "1. Create payment..."
        RES=$(curl -s -X POST http://payment-service:8080/api/payments \
          -H "Content-Type: application/json" \
          -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

        ID=$(echo $RES | jq -r '.id')
        echo "ID: $ID"
        echo "$ID" > /tmp/payment_id.txt

        echo "2. Execute payment..."
        curl -s -X POST http://payment-service:8080/api/payments/$ID/execute

        echo "3. Wait 25s (Chaos active)..."
        sleep 25

        echo "4. Validate state..."
        STATE=$(curl -s http://payment-service:8080/api/payments/$ID | jq -r '.state')
        echo "State: $STATE"

        if [ "$STATE" != "FAILED" ]; then
          echo "Error: Not FAILED. Was: $STATE"
          exit 1
        fi
        echo "OK"
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      resources: {}
    inputs: {}
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        workflows.argoproj.io/kill-cmd-istio-proxy: '["pilot-agent", "request", "POST", "quitquitquit"]'
    name: test-payment
    serviceAccountName: test-runner
    outputs:
      parameters:
      - name: payment-id
        valueFrom:
          path: /tmp/payment_id.txt
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - arguments: {}
        name: remove-chaos
        templateRef:
          name: common-test-steps
          template: remove-chaos-wallet
