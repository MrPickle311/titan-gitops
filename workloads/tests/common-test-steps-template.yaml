apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: common-test-steps
  namespace: applications
spec:
  templates:
  - name: validate-db
    inputs:
      parameters:
      - name: payment-id
      - name: expected-state
      - name: expected-history-state
        default: ""
    container:
      image: postgres:alpine
      command:
      - /bin/sh
      - -c
      args:
      - |
        echo "Connecting to Postgres to verify payment {{inputs.parameters.payment-id}}..."
        export PGPASSWORD=$DB_PASSWORD
        PID={{inputs.parameters.payment-id}}
        EXPECTED={{inputs.parameters.expected-state}}
        EXPECTED_HISTORY="{{inputs.parameters.expected-history-state}}"
        if [ -z "$EXPECTED_HISTORY" ]; then
          EXPECTED_HISTORY="$EXPECTED"
        fi

        echo "1. Checking 'payments' table..."
        STATE=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT state FROM payments WHERE id=$PID;" | xargs)
        if [ "$STATE" != "$EXPECTED" ]; then
          echo "DB Validation Error: payments state is '$STATE', expected '$EXPECTED'"
          exit 1
        fi

        echo "2. Checking 'payment_history' table for $EXPECTED_HISTORY..."
        HISTORY_COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM payment_history WHERE payment_id=$PID AND to_state='$EXPECTED_HISTORY';" | xargs)
        if [ "$HISTORY_COUNT" -eq 0 ]; then
          echo "DB Validation Error: payment_history has no $EXPECTED_HISTORY record for this payment."
          exit 1
        fi

        echo "3. Checking 'ledger_entries' table..."
        LEDGER_COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM ledger_entries WHERE payment_id=$PID;" | xargs)
        if [ "$EXPECTED" = "FAILED" ] || [ "$EXPECTED_HISTORY" = "LEDGER_NOTIFICATION_FAILED" ]; then
          if [ "$LEDGER_COUNT" -ne 0 ]; then
            echo "DB Validation Error: ledger_entries has $LEDGER_COUNT records, expected 0 (since it failed or ledger notification failed)"
            exit 1
          fi
        else
          if [ "$LEDGER_COUNT" -eq 0 ]; then
            echo "DB Validation Error: ledger_entries has 0 records, expected some for a COMPLETED payment"
            exit 1
          fi
        fi

        echo "Success! Database entities correctly reflect the $EXPECTED payment."
      env:
      - name: DB_USER
        value: postgres
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            key: postgres-password
            name: postgres-credentials
  - name: validate-kafka
    inputs:
      parameters:
      - name: payment-id
      - name: expected-state
    container:
      image: edenhill/kcat:1.7.1
      command:
      - /bin/sh
      - -c
      args:
      - |
        PID={{inputs.parameters.payment-id}}
        EXPECTED={{inputs.parameters.expected-state}}
        echo "Consuming Kafka topic payment-webhooks to find message for payment $PID..."
        sleep 3

        MSG=$(kcat -C -b kafka.messaging.svc.cluster.local:9092 -t payment-webhooks -o -100 -e -q | grep "\"paymentId\":$PID" || true)

        if [ -z "$MSG" ]; then
           echo "Error: Could not find Kafka message for payment $PID in payment-webhooks topic!"
           exit 1
        fi

        echo "Found Kafka message: $MSG"
        if ! echo "$MSG" | grep -q "\"status\":\"$EXPECTED\""; then
           echo "Error: Message does not contain $EXPECTED status!"
           exit 1
        fi
        echo "Kafka message successfully validated!"
  - container:
      args:
      - |
        echo "Waiting for Chaos Mesh to isolate fx-service pods..."
        sleep {{inputs.parameters.sleep-duration}}

        echo "Backing up dynamic FX rates from Redis..."
        # Get the current dynamic rates and format them into a single string
        RATES=$(redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD --raw HGETALL fx-conversion-rates | tr '\n' ' ')

        # Store the backed up string safely in a temporary Redis String key (redis-cli -c handles cluster redirects automatically)
        redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD SET fx-rates-backup "$RATES"

        echo "Rates saved to fx-rates-backup: $RATES"

        echo "Clearing the actual FX rates table..."
        redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD DEL fx-conversion-rates
      command:
      - /bin/sh
      - -c
      env:
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            key: redis-password
            name: redis-cluster-credentials
      image: redis:alpine
      name: ''
      resources: {}
    inputs:
      parameters:
      - name: sleep-duration
        default: '25'
    metadata: {}
    name: backup-and-clear-redis
    outputs: {}
  - container:
      args:
      - |
        echo "Retrieving backed up rates from fx-rates-backup string key..."
        RATES=$(redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD GET fx-rates-backup)

        if [ -n "$RATES" ] && [ "$RATES" != "nil" ]; then
          echo "Restoring dynamically fetched rates back to fx-conversion-rates hash..."
          # Use xargs to pass the space-separated string as arguments to HSET
          echo "$RATES" | xargs redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD HSET fx-conversion-rates
          
          echo "Cleaning up backup key..."
          redis-cli -c -h redis-redis-cluster.databases.svc.cluster.local -p 6379 -a $REDIS_PASSWORD DEL fx-rates-backup
          echo "Dynamic restoration complete!"
        else
          echo "No backup found in fx-rates-backup, skipping restore."
        fi
      command:
      - /bin/sh
      - -c
      env:
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            key: redis-password
            name: redis-cluster-credentials
      image: redis:alpine
      name: ''
      resources: {}
    inputs: {}
    metadata: {}
    name: restore-redis
    outputs: {}
  - name: apply-chaos-fx
    resource:
      action: create
      manifest: |
        kind: PodChaos
        apiVersion: chaos-mesh.org/v1alpha1
        metadata:
          namespace: applications
          name: fail-fx-service-pods
        spec:
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: fx-service
          mode: all
          action: pod-failure
  - name: remove-chaos-fx
    resource:
      action: delete
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: fail-fx-service-pods
          namespace: applications
  - name: apply-chaos-redis
    resource:
      action: create
      manifest: |
        kind: PodChaos
        apiVersion: chaos-mesh.org/v1alpha1
        metadata:
          namespace: databases
          name: redis-failure
        spec:
          selector:
            namespaces:
              - databases
            labelSelectors:
              helm.sh/chart: redis-cluster-13.0.4
          mode: all
          action: pod-failure
  - name: remove-chaos-redis
    resource:
      action: delete
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: redis-failure
          namespace: databases
  - name: apply-chaos-auth
    resource:
      action: create
      manifest: |
        kind: PodChaos
        apiVersion: chaos-mesh.org/v1alpha1
        metadata:
          namespace: applications
          name: fail-auth-service-pods
        spec:
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: authorization-service
          mode: all
          action: pod-failure
  - name: remove-chaos-auth
    resource:
      action: delete
      manifest: |
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: fail-auth-service-pods
          namespace: applications
  - name: apply-chaos-auth-rejected
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
        - |
          kubectl exec -n applications deploy/authorization-service -- sh -c '
          cat > /tmp/mock.btm << "EOF"
          RULE mock-auth-failure
          CLASS com.example.authorization.AuthorizationGrpcService
          METHOD isSuccess
          AT ENTRY
          IF true
          DO return false
          ENDRULE
          EOF
          env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -l /tmp/mock.btm
          '
  - name: remove-chaos-auth-rejected
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
        - |
          kubectl exec -n applications deploy/authorization-service -- env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -u /tmp/mock.btm
  - name: apply-chaos-fraud
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: fraud-service-failure
          namespace: applications
        spec:
          action: pod-failure
          mode: all
          duration: "30s"
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: fraud-service
        EOF
  - name: remove-chaos-fraud
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - "kubectl delete podchaos fraud-service-failure -n applications --ignore-not-found"
  - name: apply-chaos-fraud-rejected
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
        - |
          kubectl exec -n applications deploy/fraud-service -- sh -c '
          cat > /tmp/mock-fraud.btm << "EOF"
          RULE mock-fraud-detected
          CLASS com.example.fraud.application.FraudResult
          METHOD isHighRisk
          AT ENTRY
          IF true
          DO return true
          ENDRULE
          EOF
          env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -l /tmp/mock-fraud.btm
          '
  - name: remove-chaos-fraud-rejected
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
        - |
          kubectl exec -n applications deploy/fraud-service -- sh -c '
          env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -u /tmp/mock-fraud.btm
          '
  - name: apply-chaos-limits
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: limits-service-failure
          namespace: applications
        spec:
          action: pod-failure
          mode: all
          duration: "30s"
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: limits-service
        EOF
  - name: remove-chaos-limits
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - "kubectl delete podchaos limits-service-failure -n applications --ignore-not-found"
  - name: apply-chaos-sanctions
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: sanctions-service-failure
          namespace: applications
        spec:
          action: pod-failure
          mode: all
          duration: "30s"
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: sanctions-service
        EOF
  - name: remove-chaos-sanctions
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - "kubectl delete podchaos sanctions-service-failure -n applications --ignore-not-found"
  - name: apply-chaos-fee
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: fee-service-failure
          namespace: applications
        spec:
          action: pod-failure
          mode: all
          duration: "30s"
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: fee-service
        EOF
  - name: remove-chaos-fee
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - "kubectl delete podchaos fee-service-failure -n applications --ignore-not-found"
  - name: apply-chaos-wallet
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        cat <<EOF | kubectl apply -f -
        apiVersion: chaos-mesh.org/v1alpha1
        kind: PodChaos
        metadata:
          name: wallet-service-failure
          namespace: applications
        spec:
          action: pod-failure
          mode: all
          duration: "30s"
          selector:
            namespaces:
              - applications
            labelSelectors:
              app: wallet-service
        EOF
  - name: remove-chaos-wallet
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - "kubectl delete podchaos wallet-service-failure -n applications --ignore-not-found"
  - name: apply-byteman-ledger
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        kubectl exec -n applications deploy/payment-service -- sh -c '
        cat > /tmp/mock-ledger.btm << "EOF"
        RULE fail ledger notification
        CLASS com.example.payment.infrastructure.external.ledger.LedgerPublisher
        METHOD publishEvent
        AT ENTRY
        IF true
        DO throw new java.lang.RuntimeException("Simulated ledger failure");
        ENDRULE
        EOF
        env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -l /tmp/mock-ledger.btm
        '
  - name: remove-byteman-ledger
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        kubectl exec -n applications deploy/payment-service -- env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -u /tmp/mock-ledger.btm || true
  - name: validate-kafka-compensation
    inputs:
      parameters:
      - name: payment-id
    container:
      image: edenhill/kcat:1.7.1
      command:
      - /bin/sh
      - -c
      args:
      - |
        PID={{inputs.parameters.payment-id}}
        echo "Consuming Kafka topic payment-compensations to find messages for payment $PID..."
        sleep 5
        # The eventType or payload should contain the payment ID
        MSG=$(kcat -C -b kafka.messaging.svc.cluster.local:9092 -t payment-compensations -o -100 -e -q | grep "\"paymentId\":$PID" || true)
        if [ -z "$MSG" ]; then
           echo "Error: Could not find Kafka message for payment $PID in payment-compensations topic!"
           exit 1
        fi
        echo "Found Kafka message for compensation: $MSG"
        echo "Kafka compensation message successfully validated!"
  - name: apply-byteman-compensation
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        kubectl exec -n applications deploy/payment-service -- sh -c '
        cat > /tmp/mock-comp.btm << "EOF"
        RULE fail fee refund
        CLASS com.example.payment.infrastructure.external.adapter.GrpcWalletGatewayAdapter
        METHOD debit
        AT ENTRY
        IF $1.getIdempotencyKey().endsWith("-FEE_REFUND")
        DO throw new java.lang.RuntimeException("Simulated refund failure");
        ENDRULE

        RULE fail limits release
        CLASS com.example.payment.infrastructure.external.adapter.GrpcLimitsGatewayAdapter
        METHOD releaseLimit
        AT ENTRY
        IF true
        DO throw new java.lang.RuntimeException("Simulated limits release failure");
        ENDRULE
        EOF
        env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -l /tmp/mock-comp.btm
        '
  - name: remove-byteman-compensation
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args:
      - |
        kubectl exec -n applications deploy/payment-service -- env -u JAVA_TOOL_OPTIONS /opt/byteman/bin/bmsubmit.sh -p 9288 -u /tmp/mock-comp.btm || true
