apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-limits-service-exceeded-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: run-test
        template: test-payment
    - - name: validate-db
        templateRef:
          name: common-test-steps
          template: validate-db
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
          - name: expected-history-state
            value: LIMITS_EXCEEDED
    - - name: validate-kafka
        templateRef:
          name: common-test-steps
          template: validate-kafka
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
  - container:
      args:
      - |
        apk add --no-cache curl jq postgresql-client
        TX_ID="tx-$RANDOM"
        SRC_USER="999999999"
        TGT_USER="2$RANDOM$RANDOM"
        
        echo "0. Inject limit exceeded for $SRC_USER"
        export PGPASSWORD=$DB_PASSWORD
        psql -h limits-db-cluster-rw.databases.svc.cluster.local -U $DB_USER -d limits_db -c "DELETE FROM daily_limit_records WHERE user_id = $SRC_USER;"
        psql -h limits-db-cluster-rw.databases.svc.cluster.local -U $DB_USER -d limits_db -c "INSERT INTO daily_limit_records (id, amount_used, date, user_id) VALUES ($RANDOM$RANDOM, 1000000.00, CURRENT_DATE, $SRC_USER);"

        echo "1. Create payment..."
        RES=$(curl -s -X POST http://payment-service:8080/api/payments \
          -H "Content-Type: application/json" \
          -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

        ID=$(echo $RES | jq -r '.id')
        echo "ID: $ID"
        echo "$ID" > /tmp/payment_id.txt

        echo "2. Execute payment..."
        curl -s -X POST http://payment-service:8080/api/payments/$ID/execute

        echo "3. Wait 10s..."
        sleep 10

        echo "4. Validate state..."
        STATE=$(curl -s http://payment-service:8080/api/payments/$ID | jq -r '.state')
        echo "State: $STATE"

        if [ "$STATE" != "FAILED" ]; then
          echo "Error: Not FAILED. Was: $STATE"
          exit 1
        fi
        echo "OK"
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            key: username
            name: limits-db-cluster-app
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: limits-db-cluster-app
      resources: {}
    inputs: {}
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
      annotations:
        workflows.argoproj.io/kill-cmd-istio-proxy: '["pilot-agent", "request", "POST", "quitquitquit"]'
    name: test-payment
    serviceAccountName: test-runner
    outputs:
      parameters:
      - name: payment-id
        valueFrom:
          path: /tmp/payment_id.txt
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - name: do-revert-db
        template: revert-db
  - name: revert-db
    container:
      image: postgres:alpine
      command:
      - /bin/sh
      - -c
      args:
      - |
        export PGPASSWORD=$DB_PASSWORD
        psql -h limits-db-cluster-rw.databases.svc.cluster.local -U $DB_USER -d limits_db -c "DELETE FROM daily_limit_records WHERE user_id = 999999999;"
      env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            key: username
            name: limits-db-cluster-app
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: limits-db-cluster-app
