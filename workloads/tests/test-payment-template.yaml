apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-payment-template
  namespace: applications
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: get-token
            templateRef:
              name: common-test-steps
              template: get-titan-token
        - - name: run-test
            template: test-payment
            arguments:
              parameters:
                - name: token
                  value: '{{steps.get-token.outputs.parameters.token}}'
        - - name: validate-db
            templateRef:
              name: common-test-steps
              template: validate-db
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.run-test.outputs.parameters.payment-id}}'
                - name: expected-state
                  value: 'COMPLETED'
        - - name: validate-kafka
            templateRef:
              name: common-test-steps
              template: validate-kafka
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.run-test.outputs.parameters.payment-id}}'
                - name: expected-state
                  value: 'COMPLETED'
        - - name: validate-webhook
            templateRef:
              name: common-test-steps
              template: validate-webhook
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.run-test.outputs.parameters.payment-id}}'
    - name: test-payment
      serviceAccountName: test-runner
      metadata:
        labels:
          sidecar.istio.io/inject: "true"
        annotations:
          workflows.argoproj.io/kill-cmd-istio-proxy: '["pilot-agent", "request", "POST", "quitquitquit"]'
      inputs:
        parameters:
          - name: token
      container:
        image: alpine:latest
        command:
          - /bin/sh
          - -c
        args:
          - |
            apk add --no-cache curl jq
            echo "Waiting for Istio sidecar to be ready..."
            until curl -sf http://localhost:15021/healthz/ready >/dev/null 2>&1; do sleep 1; done
            BASE="https://istio-ingressgateway.istio-system.svc.cluster.local"
            AUTH="Authorization: Bearer $TOKEN"
            TX_ID="tx-$RANDOM"
            SRC_USER="1$RANDOM$RANDOM"
            TGT_USER="2$RANDOM$RANDOM"
            echo "1. Create payment..."
            RES=$(curl -sk -X POST "$BASE/api/payments" \
              -H "Host: payment.homelab" \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

            ID=$(echo $RES | jq -r '.id')
            echo "ID: $ID"
            echo "$ID" > /tmp/payment_id.txt

            echo "2. Execute payment..."
            curl -sk -X POST "$BASE/api/payments/$ID/execute" -H "Host: payment.homelab" -H "$AUTH"

            echo "3. Wait up to 60s for COMPLETED state..."
            for i in $(seq 1 30); do
              STATE=$(curl -sk "$BASE/api/payments/$ID" -H "Host: payment.homelab" -H "$AUTH" | jq -r '.state')
              echo "State: $STATE"
              if [ "$STATE" = "COMPLETED" ]; then
                echo "OK"
                exit 0
              fi
              sleep 2
            done

            echo "Error: Not completed within timeout"
            exit 1
      env:
        - name: TOKEN
          value: '{{inputs.parameters.token}}'
      outputs:
        parameters:
          - name: payment-id
            valueFrom:
              path: /tmp/payment_id.txt
