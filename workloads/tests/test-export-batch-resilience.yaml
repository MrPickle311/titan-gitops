apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-export-batch-resilience
  namespace: applications
spec:
  entrypoint: main
  onExit: cleanup
  templates:
    - name: main
      steps:
        - - name: apply-chaos
            template: apply-chaos-regulatory
        - - name: run-test
            templateRef:
              name: test-payment-template
              template: test-payment
        - - name: wait-for-job-failure
            template: wait-for-job-failure
        - - name: remove-chaos
            template: remove-chaos-regulatory
        - - name: wait-for-job-success
            template: wait-for-job-success
    - name: apply-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - |
            cat <<EOF | kubectl apply -f -
            apiVersion: chaos-mesh.org/v1alpha1
            kind: PodChaos
            metadata:
              name: regulatory-service-failure
              namespace: applications
            spec:
              action: pod-failure
              mode: all
              selector:
                namespaces:
                  - applications
                labelSelectors:
                  app: mock-regulatory-service
            EOF
    - name: remove-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - "kubectl delete podchaos regulatory-service-failure -n applications --ignore-not-found"
    - name: wait-for-job-failure
      container:
        image: postgres:alpine
        command: [sh, -c]
        args:
          - |
            export PGPASSWORD=$DB_PASSWORD
            echo "Waiting for batch job to fail because mock-regulatory-service is down..."
            # Wait up to 60s for a FAILED job execution
            for i in $(seq 1 30); do
              COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM batch_job_execution WHERE status='FAILED' AND create_time >= NOW() - INTERVAL '2 minutes';" | xargs)
              if [ "$COUNT" -gt 0 ]; then
                echo "Success: Found FAILED batch job execution!"
                exit 0
              fi
              sleep 2
            done
            echo "Error: Did not find FAILED batch job"
            exit 1
        env:
          - name: DB_USER
            value: postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: postgres-credentials
    - name: wait-for-job-success
      container:
        image: postgres:alpine
        command: [sh, -c]
        args:
          - |
            export PGPASSWORD=$DB_PASSWORD
            echo "Waiting for next batch job to run successfully (reusing offset/parameters) after chaos is removed..."
            # Wait up to 60s for a COMPLETED job execution
            for i in $(seq 1 30); do
              COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM batch_job_execution WHERE status='COMPLETED' AND create_time >= NOW() - INTERVAL '2 minutes';" | xargs)
              if [ "$COUNT" -gt 0 ]; then
                echo "Success: Found COMPLETED batch job execution!"
                exit 0
              fi
              sleep 2
            done
            echo "Error: Did not find COMPLETED batch job"
            exit 1
        env:
          - name: DB_USER
            value: postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: postgres-credentials
    - name: cleanup
      steps:
        - - name: remove-chaos
            template: remove-chaos-regulatory
