apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-export-batch-resilience
  namespace: applications
spec:
  entrypoint: main
  onExit: cleanup
  templates:
    - name: main
      steps:
        - - name: apply-chaos
            template: apply-chaos-regulatory
        - - name: run-test
            templateRef:
              name: test-payment-template
              template: test-payment
        - - name: wait-for-export-failure
            template: wait-for-export-failure
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.run-test.outputs.parameters.payment-id}}'
        - - name: remove-chaos
            template: remove-chaos-regulatory
        - - name: wait-for-export-success
            template: wait-for-export-success
            arguments:
              parameters:
                - name: payment-id
                  value: '{{steps.run-test.outputs.parameters.payment-id}}'
    - name: apply-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - |
            cat <<EOF | kubectl apply -f -
            apiVersion: chaos-mesh.org/v1alpha1
            kind: PodChaos
            metadata:
              name: regulatory-service-failure
              namespace: applications
            spec:
              action: pod-failure
              mode: all
              selector:
                namespaces:
                  - applications
                labelSelectors:
                  app: mock-regulatory-service
            EOF
    - name: remove-chaos-regulatory
      container:
        image: bitnami/kubectl:latest
        command: [sh, -c]
        args:
          - "kubectl delete podchaos regulatory-service-failure -n applications --ignore-not-found"
    - name: wait-for-export-failure
      inputs:
        parameters:
          - name: payment-id
      container:
        image: postgres:alpine
        command: [sh, -c]
        args:
          - |
            export PGPASSWORD=$DB_PASSWORD
            echo "Waiting for payment export to fail because mock-regulatory-service is down..."
            # Wait up to 60s for a FAILED export staging row
            for i in $(seq 1 30); do
              COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM payment_export_staging WHERE status='FAILED' AND payment_id={{inputs.parameters.payment-id}} AND created_at >= NOW() - INTERVAL '2 minutes';" | xargs)
              if [ "$COUNT" -gt 0 ]; then
                echo "Success: Found FAILED payment in staging!"
                exit 0
              fi
              sleep 2
            done
            echo "Error: Did not find FAILED payment export"
            exit 1
        env:
          - name: DB_USER
            value: postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: postgres-credentials
    - name: wait-for-export-success
      inputs:
        parameters:
          - name: payment-id
      container:
        image: postgres:alpine
        command: [sh, -c]
        args:
          - |
            export PGPASSWORD=$DB_PASSWORD
            echo "Waiting for payment export to run successfully after chaos is removed..."
            # Wait up to 60s for an EXPORTED staging row
            for i in $(seq 1 30); do
              COUNT=$(psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -t -c "SELECT count(*) FROM payment_export_staging WHERE status='EXPORTED' AND payment_id={{inputs.parameters.payment-id}} AND created_at >= NOW() - INTERVAL '2 minutes';" | xargs)
              if [ "$COUNT" -gt 0 ]; then
                echo "Success: Found EXPORTED payment in staging!"
                psql -h postgres-postgresql.databases.svc.cluster.local -U $DB_USER -d titan_db -c "SELECT id, payment_id, status, retry_count, created_at, exported_at FROM payment_export_staging WHERE payment_id={{inputs.parameters.payment-id}} AND created_at >= NOW() - INTERVAL '2 minutes';"
                exit 0
              fi
              sleep 2
            done
            echo "Error: Did not find EXPORTED payment export"
            exit 1
        env:
          - name: DB_USER
            value: postgres
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: postgres-password
                name: postgres-credentials
    - name: cleanup
      steps:
        - - name: remove-chaos
            template: remove-chaos-regulatory
