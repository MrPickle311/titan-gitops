apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-workflows-server
  name: test-compensation-failure-template
  namespace: applications
spec:
  arguments: {}
  entrypoint: main
  onExit: cleanup
  templates:
  - inputs: {}
    metadata: {}
    name: main
    outputs: {}
    steps:
    - - arguments: {}
        name: inject-chaos
        templateRef:
          name: common-test-steps
          template: apply-byteman-compensation
    - - arguments: {}
        name: run-test
        template: test-payment
    - - name: validate-db
        templateRef:
          name: common-test-steps
          template: validate-db
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
          - name: expected-state
            value: FAILED
    - - name: validate-outbox
        templateRef:
          name: common-test-steps
          template: validate-kafka-compensation
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
    - - name: remove-chaos
        templateRef:
          name: common-test-steps
          template: remove-byteman-compensation
    - - name: validate-retry
        templateRef:
          name: common-test-steps
          template: validate-kafka-retry
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
    - - name: validate-db-compensation
        templateRef:
          name: common-test-steps
          template: validate-db-compensation
        arguments:
          parameters:
          - name: payment-id
            value: '{{steps.run-test.outputs.parameters.payment-id}}'
  - container:
      args:
      - |
        apk add --no-cache curl jq
        TX_ID="tx-$RANDOM"
        # 999 triggers sanctions hit, forcing compensation
        SRC_USER="999"
        TGT_USER="1$RANDOM$RANDOM"
        echo "1. Create payment..."
        RES=$(curl -s --max-time 30 -X POST http://payment-service:8080/api/payments \
          -H "Content-Type: application/json" \
          -d "{\"transactionId\": \"$TX_ID\", \"amount\": \"150.00\", \"currency\": \"USD\", \"sourceUserId\": $SRC_USER, \"targetUserId\": $TGT_USER, \"sourceCurrency\": \"USD\", \"targetCurrency\": \"EUR\"}")

        ID=$(echo $RES | jq -r '.id')
        echo "ID: $ID"
        echo "$ID" > /tmp/payment_id.txt

        echo "2. Execute payment..."
        curl -s --max-time 30 -X POST http://payment-service:8080/api/payments/$ID/execute

        echo "3. Wait for state to become FAILED..."
        for i in $(seq 1 30); do
          STATE=$(curl -s --max-time 30 http://payment-service:8080/api/payments/$ID | jq -r '.state')
          echo "Current State: $STATE"
          if [ "$STATE" = "FAILED" ]; then
            echo "OK"
            exit 0
          fi
          sleep 2
        done

        echo "Error: Not FAILED after 60s. Was: $STATE"
        exit 1
      command:
      - /bin/sh
      - -c
      image: alpine:latest
      name: ''
      resources: {}
    inputs: {}
    metadata: {}
    name: test-payment
    outputs:
      parameters:
      - name: payment-id
        valueFrom:
          path: /tmp/payment_id.txt
  - inputs: {}
    metadata: {}
    name: cleanup
    outputs: {}
    steps:
    - - arguments: {}
        name: remove-chaos
        templateRef:
          name: common-test-steps
          template: remove-byteman-compensation
