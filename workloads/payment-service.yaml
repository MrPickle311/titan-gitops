apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: applications
  labels:
    app: payment-service
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payment-service
      volumes:
        - name: pyroscope-agent
          emptyDir: {}
      initContainers:
        - name: fetch-otel-pyroscope
          image: busybox:latest
          command:
            - sh
            - -c
            - "wget -O /agent/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar && wget -O /agent/pyroscope-otel.jar https://github.com/grafana/otel-profiling-java/releases/latest/download/pyroscope-otel.jar && wget -O /agent/pyroscope.jar https://github.com/grafana/pyroscope-java/releases/latest/download/pyroscope.jar"
          volumeMounts:
            - name: pyroscope-agent
              mountPath: /agent
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: payment-service
        image: registry.homelab/payment-service:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            cpu: 1000m
            memory: 1500Mi
        ports:
        - containerPort: 8080
        volumeMounts:
          - name: pyroscope-agent
            mountPath: /agent
        env:
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "*"
        - name: MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES
          value: "ALWAYS"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/opt/byteman/lib/byteman.jar=listener:true,port:9288,address:0.0.0.0 -javaagent:/agent/pyroscope.jar -javaagent:/agent/opentelemetry-javaagent.jar"
        - name: OTEL_JAVAAGENT_EXTENSIONS
          value: "/agent/pyroscope-otel.jar"
        - name: OTEL_PYROSCOPE_START_PROFILING
          value: "true"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_URL
          value: "false"
        - name: OTEL_PYROSCOPE_ADD_PROFILE_BASELINE_URL
          value: "false"
        - name: OTEL_SERVICE_NAME
          value: "payment-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo.monitoring.svc.cluster.local:4318"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: LOGGING_PATTERN_LEVEL
          value: "trace_id=%X{trace_id} span_id=%X{span_id} %5p"
        - name: OTEL_INSTRUMENTATION_KAFKA_ENABLED
          value: "true"
        - name: SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED
          value: "true"
        - name: SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED
          value: "true"
        - name: PYROSCOPE_APPLICATION_NAME
          value: "payment-service"
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://pyroscope.monitoring.svc.cluster.local:4040"
        - name: PYROSCOPE_FORMAT
          value: "jfr"
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: "1ms"
        - name: PYROSCOPE_PROFILER_EVENT
          value: "wall"
        - name: PYROSCOPE_PROFILER_LOCK
          value: "10ms"
        - name: PYROSCOPE_PROFILER_ALLOC
          value: "128k"
        - name: PYROSCOPE_LOG_LEVEL
          value: "info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PYROSCOPE_LABELS
          value: "pod=$(POD_NAME),service_name=payment-service"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-postgresql.databases.svc.cluster.local:5432/titan_db
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: REDIS_HOST
          value: redis-redis-cluster.databases.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-credentials
              key: redis-password
              optional: true
        - name: WALLET_SERVICE_URL
          value: http://wallet-service:8081
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka.messaging.svc.cluster.local:9092
        - name: GRPC_AUTHORIZATION_SERVICE_ADDRESS
          value: static://authorization-service:9091
        - name: GRPC_AUTHORIZATION_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_FEE_SERVICE_ADDRESS
          value: static://fee-service:9091
        - name: GRPC_FEE_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_FRAUD_SERVICE_ADDRESS
          value: static://fraud-service:9091
        - name: GRPC_FRAUD_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_FX_SERVICE_ADDRESS
          value: static://fx-service:9091
        - name: GRPC_FX_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_LIMITS_SERVICE_ADDRESS
          value: static://limits-service:9091
        - name: GRPC_LIMITS_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_SANCTIONS_SERVICE_ADDRESS
          value: static://sanctions-service:9091
        - name: GRPC_SANCTIONS_SERVICE_NEGOTIATION_TYPE
          value: plaintext
        - name: GRPC_WALLET_SERVICE_ADDRESS
          value: static://wallet-service:9090
        - name: GRPC_WALLET_SERVICE_NEGOTIATION_TYPE
          value: plaintext
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: applications
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-service-monitor
  namespace: applications
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: payment-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-service-ingress
  namespace: applications
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
spec:
  tls:
    - hosts:
        - payment.homelab
      secretName: payment-tls-secret
  rules:
  - host: payment.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8080
