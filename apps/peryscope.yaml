apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 1.20.3
    chart: pyroscope
    helm:
      values: |
        pyroscope:
          storage:
            backend: filesystem
            filesystem:
              directory: /var/lib/pyroscope
          # Ograniczamy zużycie RAMu na potrzeby homelaba
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    # Wdrażamy tam gdzie resztę stosu Grafany
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true