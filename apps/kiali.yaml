apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://kiali.org/helm-charts'
    targetRevision: 1.84.0 # Stabilna wersja Kiali
    chart: kiali-server
    helm:
      values: |
        # Dla homelabu wyłączamy konieczność logowania się tokenami (wygoda!)
        auth:
          strategy: anonymous
          
        # Kiali potrzebuje Prometheusa, by wiedzieć o ruchu sieciowym
        external_services:
          prometheus:
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          grafana:
            enabled: true
            in_cluster_url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
            url: "https://grafana.homelab"
            
          # FIX: Oszukujemy Kiali. Ustawiamy protokół Jaegera (którego Kiali kocha i rozumie domyślnie), 
          # ale kierujemy go na port gRPC (9095) należący do Grafana Tempo!
          tracing:
            enabled: true
            provider: "jaeger"
            in_cluster_url: "http://tempo.monitoring.svc.cluster.local:9095"
            internal_url: "http://tempo.monitoring.svc.cluster.local:9095" # Dla kompatybilności wstecznej Helm Charta
            url: "https://grafana.homelab/explore"
            
        # Konfiguracja wystawienia panelu na zewnątrz
        server:
          port: 20001
          web_root: ""
          
        ingress:
          enabled: true
          ingressClassName: "nginx"
          annotations:
            cert-manager.io/cluster-issuer: "homelab-ca-issuer"
          hosts:
            - kiali.homelab
          tls:
            - secretName: kiali-tls-secret
              hosts:
                - kiali.homelab
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true