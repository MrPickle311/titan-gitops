apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 32.4.3
    chart: kafka
    helm:
      values: |
        image:
          repository: bitnamilegacy/kafka
          tag: 4.0.0-debian-12-r10
        
        kraft:
          enabled: true
        zookeeper:
          enabled: false
        
        # --- KLUCZOWY FIX: WYMUSZENIE PLAINTEXT ---
        # Wyłączamy domyślne uwierzytelnianie SASL, aby Schema Registry i C3 mogły się połączyć
        listeners:
          client:
            protocol: PLAINTEXT
          controller:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
        auth:
          clientProtocol: plaintext
          interBrokerProtocol: plaintext

        controller:
          replicaCount: 1
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 5Gi

        broker:
          replicaCount: 3
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 10Gi
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

        metrics:
          jmx:
            image:
              repository: bitnamilegacy/jmx-exporter
              tag: 1.4.0-debian-12-r0
            enabled: true
          kafka:
            enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 30s
            labels:
              release: kube-prometheus-stack

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true