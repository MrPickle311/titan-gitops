apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    # Cofamy chart do linii 31.x, zanim wprowadzono domyślnie Kafkę 4.0
    targetRevision: 31.0.0
    chart: kafka
    helm:
      values: |
        image:
          repository: bitnamilegacy/kafka
          # Używamy stabilnej Kafki 3.9.0. Confluent nie obsługuje jeszcze 4.0.0!
          tag: 3.9.0-debian-12-r0
        
        kraft:
          enabled: true
        zookeeper:
          enabled: false
        
        # Wymuszenie PLAINTEXT dla kompatybilności ze Schema Registry
        listeners:
          client:
            protocol: PLAINTEXT
          controller:
            protocol: PLAINTEXT
          interbroker:
            protocol: PLAINTEXT
        auth:
          clientProtocol: plaintext
          interBrokerProtocol: plaintext

        controller:
          replicaCount: 1
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 5Gi

        broker:
          replicaCount: 3
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 10Gi
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

        metrics:
          jmx:
            enabled: true
          kafka:
            enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 30s
            labels:
              release: kube-prometheus-stack

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true