apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 32.4.3
    chart: kafka
    helm:
      values: |
        image:
          repository: bitnamilegacy/kafka
          tag: 4.0.0-debian-12-r10
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    # ZAKOMENTOWANE: Bitnami usuwa stare tagi. Brak tej linijki = najnowsza, działająca wersja.
    # targetRevision: 29.3.0 
    chart: kafka
    helm:
      values: |
        # Włączamy nowoczesny tryb KRaft (bez Zookeepera)
        kraft:
          enabled: true
        zookeeper:
          enabled: false
        
        # Węzeł zarządczy klastrem (wymaga mało zasobów)
        controller:
          replicaCount: 1
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 5Gi

        # Węzły robocze (Brokery trzymające faktyczne wiadomości)
        broker:
          replicaCount: 3
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 10Gi
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

        # --- MONITORING (PROMETHEUS) ---
        metrics:
          # Eksportuje metryki wbudowane w silnik Javy (JVM)
          jmx:
            enabled: true
          # Eksportuje logikę Kafki (Topici, opóźnienia konsumentów)
          kafka:
            enabled: true
          # Automatyczna integracja z Twoim Prometheus Operatorem
          serviceMonitor:
            enabled: true
            # Jeśli masz wiele Prometheusów, to pozwala im filtrować co zbierają
            labels:
              release: kube-prometheus-stack

  destination:
    server: 'https://kubernetes.default.svc'
    # Tworzymy dedykowany namespace dla systemów kolejkowych
    namespace: messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true