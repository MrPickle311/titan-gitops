apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 2.10.2
    chart: loki-stack
    helm:
      values: |
        loki:
          persistence:
            enabled: true
            storageClassName: "openebs-hostpath"
            size: 10Gi
            
          # ROZWIĄZANIE: Usuwamy initContainer z rootem. 
          # Zamiast tego używamy natywnego Kubernetesowego 'fsGroup', 
          # który jest bezpieczny i przepuszczany przez Talos OS.
          securityContext:
            fsGroup: 10001
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
                  
        promtail:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true