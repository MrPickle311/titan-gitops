apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wikijs-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 18.5.16
    chart: postgresql
    helm:
      values: |
        image:
          repository: bitnamilegacy/postgresql
          tag: 17.6.0-debian-12-r0
        auth:
          database: wikijs
          username: wikijs
          existingSecret: wikijs-db-credentials
          secretKeys:
            userPasswordKey: password
            adminPasswordKey: password
        
        primary:
          persistence:
            enabled: true
            storageClass: "openebs-hostpath"
            size: 5Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
