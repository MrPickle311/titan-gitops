apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 10.0.0
    chart: redis-cluster
    helm:
      values: |
        cluster:
          nodes: 6
          replicas: 1
        
        usePassword: true
        existingSecret: "redis-cluster-credentials"
        existingSecretPasswordKey: "redis-password"

        service:
          type: LoadBalancer
          loadBalancerIP: "10.0.0.202"

        persistence:
          enabled: true
          storageClass: "openebs-hostpath"
          size: 5Gi

        redis:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true