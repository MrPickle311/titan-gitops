apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.21.0
    chart: istiod
    helm:
      values: |
        global:
          tracer:
            zipkin:
              address: tempo.monitoring.svc.cluster.local:9411
          cni:
            enabled: true
        istio_cni:
          enabled: true
        pilot:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true